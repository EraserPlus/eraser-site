<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 - 工具箱</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="navbar">
  <span class="logo">🧩 Eraser 的小站</span>
  <nav>
    <a href="../index.html">首页</a>
    <a href="../search/index.html">搜索</a>
    <a href="index.html" class="active">工具箱</a>
    <a href="../blog/index.html">博客</a>
    <a href="../nav/index.html">导航</a>
    <a href="../about/index.html">关于</a>
  </nav>
</div>
<div class="container">
  <h1>🔑 密码生成器</h1>
  <p class="muted"><a href="index.html">← 返回工具箱</a></p>

  <div class="tool-box">
    <div class="row">
      <label>长度：</label>
      <input type="number" id="len" value="16" min="4" max="64" style="width:80px">
      <label><input type="checkbox" id="upper" checked> 大写字母</label>
      <label><input type="checkbox" id="lower" checked> 小写字母</label>
      <label><input type="checkbox" id="digit" checked> 数字</label>
      <label><input type="checkbox" id="symbol"> 符号</label>
    </div>
    <div class="row">
      <button onclick="generate()">生成</button>
      <button class="ghost" onclick="copyPwd()">复制</button>
    </div>
    <div class="output" id="out">点击"生成"按钮</div>
  </div>
</div>
<script>
function generate() {
  const len = +document.getElementById('len').value;
  let chars = '';
  if (document.getElementById('upper').checked)  chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (document.getElementById('lower').checked)  chars += 'abcdefghijklmnopqrstuvwxyz';
  if (document.getElementById('digit').checked)  chars += '0123456789';
  if (document.getElementById('symbol').checked) chars += '!@#$%^&*()-_=+[]{};:,.<>?';
  if (!chars) { document.getElementById('out').textContent = '请至少勾选一种字符'; return; }
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let pwd = '';
  for (let i = 0; i < len; i++) pwd += chars[arr[i] % chars.length];
  document.getElementById('out').textContent = pwd;
}
function copyPwd() {
  const t = document.getElementById('out').textContent;
  navigator.clipboard.writeText(t).then(() => alert('已复制'));
}
</script>
</body>
</html>
