name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 测试用假驱动（neon + vercel/blob）覆盖 npm ci 装回来的真包，无需真服务
      - run: rm -rf node_modules/@neondatabase node_modules/@vercel && mkdir -p node_modules/@neondatabase node_modules/@vercel && cp -r tests/stubs/@neondatabase/* node_modules/@neondatabase/ && cp -r tests/stubs/@vercel/* node_modules/@vercel/
      - run: npm test
