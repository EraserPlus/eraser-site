/* 尽早定主题，避免闪白；没存过就跟随系统偏好（切换按钮与命令面板见 shell.js） */

<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.webmanifest">

<meta name="description" content="Eraser 的网址导航：常用站点分类整理，支持搜索、星标、最近访问与离线使用。">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Eraser 的小站">
<meta property="og:title" content="网址导航 · Eraser 的小站">
<meta property="og:description" content="Eraser 的网址导航：常用站点分类整理，支持搜索、星标、最近访问与离线使用。">

<style>
/* 本页只写 style.css 里没有的样式；导航栏、容器基础一律交给 style.css，保证和全站一致 */
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff6ff;
  --ink:#24292f; --muted:#6b7280; --line:#e5e7eb;
  --bg:#f5f6f8; --card:#ffffff;
  --red:#dc2626; --red-l:#fef2f2; --green:#16a34a; --green-l:#f0fdf4;
  --amber:#b45309; --amber-l:#fffbeb;
  --mark:#fde68a;
}
body{ font-size:15px; -webkit-font-smoothing:antialiased; }
.container{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13.5px}
.sub b{color:var(--ink)}

/* 搜索 */
.searchwrap{position:relative;margin-bottom:14px}
#q{
  width:100%;padding:13px 46px 13px 40px;border:1px solid var(--line);border-radius:11px;
  font-family:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none;
}
#q:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.searchwrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.searchwrap kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-family:inherit;font-size:11.5px;color:var(--muted);background:#f1f5f9;
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;pointer-events:none;
}
.searchwrap kbd.hide{display:none}

/* 工具条 */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.views{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.views button{
  font-family:inherit;font-size:13.5px;padding:6px 14px;border:none;background:transparent;
  color:var(--muted);border-radius:7px;cursor:pointer;
}
.views button:hover{color:var(--ink);background:#f8fafc}
.views button.active{background:var(--blue);color:#fff;font-weight:600}
.right{display:flex;flex-wrap:wrap;gap:8px}
.right button{
  font-family:inherit;font-size:13px;padding:7px 13px;border:1px solid var(--line);
  background:#fff;color:var(--muted);border-radius:8px;cursor:pointer;
}
.right button:hover{color:var(--ink);background:#f8fafc}

/* ===== 双端布局：桌面左侧分类栏 + 右侧主区；移动端单列 + 横滑分类条 ===== */
.layout{display:block}
.main{min-width:0}
.side{display:none}
.side-title{font-size:12px;color:var(--muted);margin:0 0 8px 2px;letter-spacing:.08em}
.catbar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catbar .chip{flex:0 0 auto;white-space:nowrap}
@media(min-width:1024px){
  .layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;align-items:start}
  .side{display:block;position:sticky;top:78px}
  .catbar{display:none}
  .sideitem{
    display:flex;justify-content:space-between;align-items:center;width:100%;
    font-family:inherit;font-size:14px;padding:9px 12px;border:none;background:transparent;
    color:var(--ink);border-radius:9px;cursor:pointer;text-align:left;margin-bottom:2px;
  }
  .sideitem:hover{background:#f1f5f9}
  .sideitem.active{background:var(--blue-l);color:var(--blue);font-weight:600}
  .sideitem .n{font-size:12px;font-weight:400;color:var(--muted);background:rgba(15,23,42,.06);border-radius:20px;padding:1px 8px}
  .sideitem.active .n{background:rgba(37,99,235,.12);color:var(--blue)}
}

/* 标签条 */
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{
  font-size:12.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--muted);cursor:pointer;user-select:none;
}
.chip:hover{border-color:#cbd5e1;color:var(--ink)}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.chip .n{opacity:.6;margin-left:3px;font-size:11.5px}
.tagbar .clear{font-size:12.5px;padding:4px 11px;border-radius:20px;border:1px dashed #cbd5e1;background:transparent;color:var(--muted);cursor:pointer}

.count{font-size:12.5px;color:var(--muted);margin:10px 0 18px}
.count b{color:var(--ink);font-weight:600}

/* 分类 */
.cat{margin-bottom:26px}
.cath[draggable="true"]{ cursor:move; }
.cat.dragging{ opacity:.5; }
.cat.dragover .cath{ box-shadow:inset 0 3px 0 var(--blue); border-radius:4px; }
.cath{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.cath button{
  font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);
  background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:7px;
}
.cath .chev{color:var(--muted);font-size:12px;transition:transform .15s;display:inline-block}
.cat.folded .chev{transform:rotate(-90deg)}
.cath .n{font-size:12px;font-weight:400;color:var(--muted);background:#f1f5f9;border-radius:20px;padding:1px 9px}
.cat.folded .grid{display:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

/* 紧凑密度：一屏看更多，描述行收起来 */
body.dense .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
body.dense a.card{padding:9px 11px;gap:9px}
body.dense a.card .ico{flex-basis:28px;width:28px;height:28px;border-radius:8px;font-size:13px}
body.dense a.card .ds{display:none}
body.dense .cat{margin-bottom:18px}
body.dense .cath button{font-size:15px}

/* 卡片 */
a.card{
  display:flex;gap:11px;align-items:flex-start;padding:12px 13px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  color:inherit;text-decoration:none;position:relative;transition:border-color .15s,box-shadow .15s;
}
a.card:hover{border-color:#bfdbfe;box-shadow:0 1px 3px rgba(15,23,42,.06);text-decoration:none}
a.card.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
a.card .ico{
  flex:0 0 34px;width:34px;height:34px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-weight:600;font-size:15px;
  position:relative;overflow:hidden;
}
/* favicon：服务端代理来的同源小图，盖在首字母图标上；抓不到就 onerror 隐藏，露出首字母 */
a.card .icoimg{
  position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);
  object-fit:contain;background:var(--card);border-radius:6px;
}
a.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
a.card .top{display:flex;align-items:center;gap:6px}
a.card .nm{font-weight:600;font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.card .url{font-size:12px;color:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.card .ds{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 提示词：后台给链接写的小提示，前台卡片以小字显示 */
a.card .tip{font-size:11.5px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.card .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
a.card .tg i{
  font-style:normal;font-size:11px;padding:1px 7px;border-radius:20px;
  background:#f1f5f9;color:#64748b;cursor:pointer;
}
a.card .tg i:hover{background:var(--blue-l);color:var(--blue-d)}
/* 卡片右上角操作组：复制 + 星标 */
.acts{position:absolute;top:8px;right:9px;display:flex;align-items:center;gap:1px}
.acts .star,.acts .copy{
  font-size:13px;color:#cbd5e1;cursor:pointer;line-height:1;padding:3px 4px;border-radius:6px;
  font-family:inherit;
}
.acts .copy{font-size:11px;padding:3px 5px}
.acts .copy:hover{color:var(--blue);background:var(--blue-l)}
.acts .star:hover{color:#f59e0b}
.acts .star.on{color:#f59e0b}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
/* 最近访问的相对时间（仅「最近」视图显示） */
a.card .tm{font-size:11px;color:#94a3b8;margin-top:1px}
body.dense a.card .tm{display:none}

/* 空状态 / 提示 */
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14px}
.empty b{color:var(--ink)}
.note{font-size:13px;border-radius:9px;padding:11px 14px;margin:0 0 16px;border:1px solid}
.note.ok{background:var(--green-l);border-color:#bbf7d0;color:#14532d}
.note.warn{background:var(--amber-l);border-color:#fde68a;color:#78350f}
.note.err{background:var(--red-l);border-color:#fecaca;color:#7f1d1d}
.note.hide{display:none}
.footnote{color:var(--muted);font-size:12.5px;text-align:center;margin-top:34px;line-height:1.9}
.footnote code{background:#f1f5f9;border-radius:4px;padding:1px 5px;font-size:12px}

/* 回到顶部：滚动过一屏才出现，双端一致 */
.btntop{
  position:fixed;right:18px;bottom:22px;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:17px;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 10px rgba(15,23,42,.10);z-index:50;font-family:inherit;
}
.btntop.show{display:flex}
.btntop:hover{color:var(--blue);border-color:#bfdbfe}

/* 移动端：输入框 16px 防 iOS 聚焦自动放大 */
@media(max-width:600px){
  #q{font-size:16px}
  .container{padding:20px 14px 64px}
  .toolbar{gap:8px}
  .views button{padding:7px 12px}
  .right button{padding:8px 12px}
}

/* ===== 暗色：手动切换（html[data-theme="dark"]，按钮见 shell.js） ===== */
/* 覆盖上面 :root 的变量为暗色值（参照 admin 后台暗色方案，品牌蓝提亮保证对比度），
   并把本页硬编码的浅色表面/描边/文字逐一改成暗色，与变量配套。
   说明：375px 宽度下 .grid 有 600px 断点、toolbar/tagbar/catbar 均已 flex/横滑，
   顶栏换行由 style.css 的 768px 断点负责（本页引了 style.css），实测无破损。
   图标底色/文字是 JS 里按名称生成的 hsl() 动态色（禁动逻辑），暗色下保持原样。 */
html[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --sunk:#1c2128;
  --ink:#e6edf3; --muted:#7d8590; --line:#272c33;
  --blue:#60a5fa; --blue-d:#3b82f6; --blue-l:#16233a;
  --red:#ff7b72; --red-l:#2d1517;
  --green:#3fb950; --green-l:#0f2417;
  --amber:#d29922; --amber-l:#2b2210;
  --mark:#713f12;
}
html[data-theme="dark"] #q{ background:var(--card); }
html[data-theme="dark"] .views{ background:var(--card); }
html[data-theme="dark"] .views button:hover{ background:var(--sunk); }
html[data-theme="dark"] .views button.active{ color:#0d1117; }
html[data-theme="dark"] .right button{ background:var(--card); }
html[data-theme="dark"] .right button:hover{ background:var(--sunk); }
html[data-theme="dark"] .chip{ background:var(--card); }
html[data-theme="dark"] .chip:hover{ border-color:#3d444d; }
html[data-theme="dark"] .chip.active{ color:#0d1117; }
html[data-theme="dark"] .tagbar .clear{ border-color:#3d444d; }
html[data-theme="dark"] .cath .n{ background:var(--sunk); }
html[data-theme="dark"] a.card:hover{ border-color:#1e3a5f; }
html[data-theme="dark"] a.card .url{ color:var(--muted); }
html[data-theme="dark"] a.card .tm{ color:var(--muted); }
html[data-theme="dark"] a.card .tip{ color:var(--muted); }
html[data-theme="dark"] a.card .tg i{ background:var(--sunk); color:var(--muted); }
html[data-theme="dark"] .acts .star,html[data-theme="dark"] .acts .copy{ color:#4b5563; }
html[data-theme="dark"] .acts .copy:hover{ color:var(--blue); background:var(--blue-l); }
html[data-theme="dark"] .acts .star:hover,html[data-theme="dark"] .acts .star.on{ color:#f59e0b; }
html[data-theme="dark"] .footnote code{ background:var(--sunk); }
html[data-theme="dark"] .searchwrap kbd{ background:var(--sunk); }
html[data-theme="dark"] .note.ok{ border-color:#1f4429; color:var(--green); }
html[data-theme="dark"] .note.warn{ border-color:#4a3a12; color:var(--amber); }
html[data-theme="dark"] .note.err{ border-color:#4a1f1f; color:var(--red); }
html[data-theme="dark"] .side-title{ color:var(--muted); }
html[data-theme="dark"] .sideitem{ color:var(--ink); }
html[data-theme="dark"] .sideitem:hover{ background:var(--sunk); }
html[data-theme="dark"] .sideitem.active{ background:var(--blue-l); color:var(--blue); }
html[data-theme="dark"] .sideitem .n{ background:rgba(255,255,255,.06); color:var(--muted); }
html[data-theme="dark"] .sideitem.active .n{ background:rgba(96,165,250,.16); color:var(--blue); }
html[data-theme="dark"] .btntop{ background:var(--card); border-color:var(--line); color:var(--muted); box-shadow:0 2px 10px rgba(0,0,0,.4); }
html[data-theme="dark"] .btntop:hover{ color:var(--blue); border-color:#1e3a5f; }
</style>
</head>

<script>
/* ===== NAV-CORE-START ===== */
/* 纯逻辑层：不碰 DOM，可以在 Node 里单独测 */
var NavCore = (function(){
"use strict";

function norm(s){ return String(s == null ? "" : s).toLowerCase(); }

function hostOf(url){
  var s = String(url || "");
  try { return new URL(s).host.replace(/^www\./, ""); }
  catch (e) {
    return s.replace(/^https?:\/\//, "").replace(/^www\./, "").split(/[/?#]/)[0];
  }
}

function initialOf(name){
  var s = String(name == null ? "" : name).trim();
  return s ? s.charAt(0).toUpperCase() : "?";
}

/* 由名称推出一个稳定的色相，用来给图标上色 */
function hueOf(str){
  var h = 0, s = String(str || "");
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function categoriesOf(data){
  return (data && Array.isArray(data.categories)) ? data.categories : [];
}

function allLinks(data){
  var out = [];
  categoriesOf(data).forEach(function(c){
    (c.links || []).forEach(function(l){ out.push(l); });
  });
  return out;
}

function countLinks(data){ return allLinks(data).length; }

function parseQuery(q){
  return norm(q).split(/\s+/).filter(Boolean);
}

/* extra 用来把所属分类名也纳入搜索范围，这样搜「娱乐」能搜出该分类下的站；
   keywords 是后台给链接设的搜索关键词（别名），tip 是给自己的提示词，也一并进索引 */
function haystack(link, extra){
  return norm([link.name, link.url, link.desc, link.tip, (link.tags || []).join(" "), (link.keywords || []).join(" "), extra || ""].join(" "));
}

function matchesQuery(link, terms, extra){
  if (!terms.length) return true;
  var hay = haystack(link, extra);
  for (var i = 0; i < terms.length; i++){
    if (hay.indexOf(norm(terms[i])) === -1) return false;
  }
  return true;
}

function matchesTags(link, tags){
  if (!tags || !tags.length) return true;
  var lt = link.tags || [];
  for (var i = 0; i < tags.length; i++) if (lt.indexOf(tags[i]) === -1) return false;
  return true;
}

/* 最近访问：recents 是 [{url, t}]（t 为毫秒时间戳）。
   按时间倒序去重，只保留数据里还存在的链接，最多 limit 条。 */
function recentLinks(data, recents, limit){
  var seen = {}, out = [];
  var all = allLinks(data);
  var sorted = (recents || []).slice().sort(function(a, b){ return ((b && b.t) || 0) - ((a && a.t) || 0); });
  for (var k = 0; k < sorted.length; k++){
    var r = sorted[k];
    if (!r || !r.url || seen[r.url]) continue;
    seen[r.url] = 1;
    for (var i = 0; i < all.length; i++){
      if (all[i].url === r.url){ out.push(all[i]); break; }
    }
    if (limit && out.length >= limit) break;
  }
  return out;
}

/* 返回过滤后的分类；空分类会被丢掉 */
function filterCategories(data, opts){
  opts = opts || {};
  var terms = parseQuery(opts.query);
  var tags = opts.tags || [];
  var stars = opts.stars || [];
  var clicks = opts.clicks || {};
  var view = opts.view || "all";
  var cat = opts.cat || "";
  var out = [];

  /* 最近视图：先按时间倒序取出最近访问，再按分类归组，组内也按时间排 */
  if (view === "recent"){
    var recent = recentLinks(data, opts.recents, opts.recentLimit || 30);
    var rank = {};
    recent.forEach(function(l, i){ rank[l.url] = i; });
    categoriesOf(data).forEach(function(c){
      if (cat && c.id !== cat) return;
      var links = (c.links || []).filter(function(l){
        if (rank[l.url] === undefined) return false;
        if (!matchesQuery(l, terms, c.name)) return false;
        if (!matchesTags(l, tags)) return false;
        return true;
      });
      if (links.length){
        links.sort(function(a, b){ return rank[a.url] - rank[b.url]; });
        out.push({ id: c.id, name: c.name, links: links });
      }
    });
    return out;
  }

  categoriesOf(data).forEach(function(c){
    if (cat && c.id !== cat) return;
    var links = (c.links || []).filter(function(l){
      if (!matchesQuery(l, terms, c.name)) return false;
      if (!matchesTags(l, tags)) return false;
      if (view === "star" && stars.indexOf(l.url) === -1) return false;
      if (view === "top" && !(clicks[l.url] > 0)) return false;
      return true;
    });
    if (view === "top"){
      links = links.slice().sort(function(a, b){
        return (clicks[b.url] || 0) - (clicks[a.url] || 0);
      });
    }
    if (links.length) out.push({ id: c.id, name: c.name, links: links });
  });
  return out;
}

function collectTags(data){
  var map = {};
  allLinks(data).forEach(function(l){
    (l.tags || []).forEach(function(t){ map[t] = (map[t] || 0) + 1; });
  });
  return Object.keys(map).map(function(t){ return { tag: t, count: map[t] }; })
    .sort(function(a, b){ return b.count - a.count || a.tag.localeCompare(b.tag, "zh"); });
}

/* 找出所有命中区间并合并重叠，用于高亮 */
function matchRanges(text, terms){
  var s = String(text == null ? "" : text);
  if (!terms || !terms.length) return [];
  var low = s.toLowerCase();
  if (low.length !== s.length) return [];   // 大小写转换改变了长度，放弃高亮以免错位
  var ranges = [];
  terms.forEach(function(t){
    if (!t) return;
    var from = 0, idx;
    while ((idx = low.indexOf(t, from)) !== -1){
      ranges.push({ start: idx, end: idx + t.length });
      from = idx + t.length;
    }
  });
  if (!ranges.length) return [];
  ranges.sort(function(a, b){ return a.start - b.start || b.end - a.end; });
  var merged = [ranges[0]];
  for (var i = 1; i < ranges.length; i++){
    var last = merged[merged.length - 1], cur = ranges[i];
    if (cur.start <= last.end) last.end = Math.max(last.end, cur.end);
    else merged.push(cur);
  }
  return merged;
}

function serialize(data){
  return "window.NAV_DATA = " + JSON.stringify(data, null, 2) + ";\n";
}

/* 接受两种输入：导出的 links.js 原文，或纯 JSON。
   links.js 原文是手写的 JS 对象 literal（键名不带引号），JSON.parse 不了，
   先用 Function 求值兜底（与页面直接 <script> 加载它等价）。 */
function parseImport(text){
  var s = String(text == null ? "" : text).trim();
  var m = s.match(/window\.NAV_DATA\s*=\s*([\s\S]*?);?\s*$/);
  if (m) s = m[1];
  var obj;
  try { obj = JSON.parse(s); }               // 导航页导出的格式（键名带引号）
  catch (e) { obj = (new Function("return (" + s + ")"))(); }  // 手写的原始 links.js（键名不带引号）
  if (!obj || !Array.isArray(obj.categories)) throw new Error("找不到 categories 数组");
  obj.categories.forEach(function(c, i){
    if (!c || !Array.isArray(c.links)) throw new Error("第 " + (i + 1) + " 个分类缺少 links 数组");
  });
  return obj;
}

/* 相对时间：刚刚 / N 分钟前 / N 小时前 / N 天前 / 超过一周给 MM-DD */
function relTime(t, now){
  now = (now == null ? Date.now() : now);
  var ts = Number(t) || 0;
  var d = Math.max(0, now - ts);
  if (d < 60000) return "刚刚";
  if (d < 3600000) return Math.floor(d / 60000) + " 分钟前";
  if (d < 86400000) return Math.floor(d / 3600000) + " 小时前";
  if (d < 7 * 86400000) return Math.floor(d / 86400000) + " 天前";
  var dt = new Date(ts);
  return (dt.getMonth() + 1) + "-" + (dt.getDate() < 10 ? "0" : "") + dt.getDate();
}

/* 导出成 Markdown 链接表：写博客时直接粘 */
function toMarkdown(data){
  var lines = ["# 网址导航", ""];
  categoriesOf(data).forEach(function(c){
    lines.push("## " + c.name, "");
    (c.links || []).forEach(function(l){
      var line = "- [" + l.name + "](" + l.url + ")";
      if (l.desc) line += " — " + l.desc;
      lines.push(line);
    });
    lines.push("");
  });
  return lines.join("\n");
}

/* 按用户拖拽出的顺序重排分类：order 是分类 id 数组。
   没提到的分类按原相对顺序跟在后面；order 里不存在的 id 忽略。 */
function applyOrder(data, order){
  var cats = categoriesOf(data);
  var list = Array.isArray(order) ? order : [];
  var seen = {}, head = [];
  list.forEach(function(id){
    if (seen[id]) return;
    for (var i = 0; i < cats.length; i++){
      if (cats[i].id === id){ seen[id] = 1; head.push(cats[i]); break; }
    }
  });
  var tail = cats.filter(function(c){ return !seen[c.id]; });
  return { categories: head.concat(tail) };
}

return {
  norm: norm, hostOf: hostOf, initialOf: initialOf, hueOf: hueOf,
  categoriesOf: categoriesOf, allLinks: allLinks, countLinks: countLinks,
  parseQuery: parseQuery, matchesQuery: matchesQuery, matchesTags: matchesTags, haystack: haystack,
  recentLinks: recentLinks, relTime: relTime, toMarkdown: toMarkdown, applyOrder: applyOrder,
  filterCategories: filterCategories, collectTags: collectTags,
  matchRanges: matchRanges, serialize: serialize, parseImport: parseImport
};
})();
/* ===== NAV-CORE-END ===== */
</script>

<script>
"use strict";
(function(){
var C = NavCore;

/* ---------- DOM 小工具 ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function download(blob, name){
  var a = document.createElement("a");
  var url = URL.createObjectURL(blob);
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
}

/* ---------- 本地存储（隐私模式下可能抛错，一律吞掉） ---------- */
function load(key, fallback){
  try {
    var raw = localStorage.getItem("nav." + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function save(key, value){
  try { localStorage.setItem("nav." + key, JSON.stringify(value)); } catch (e) {}
}

/* ---------- 状态 ---------- */
var state = {
  data: (window.NAV_DATA && Array.isArray(window.NAV_DATA.categories))
        ? window.NAV_DATA : { categories: [] },
  query: "",
  tags: [],
  view: "all",
  cat: "",
  density: load("density", "comfy"),
  order: load("order", []),
  stars: load("stars", []),
  clicks: load("clicks", {}),
  recent: load("recent", []),
  folded: load("folded", {})
};
var sel = -1;
var RECENT_MAX = 50;      /* 最近访问最多记多少条 */
var RECENT_SHOW = 30;     /* 最近视图最多展示多少条 */

var qEl = $("q"), kbdHint = $("kbdHint"), tagbar = $("tagbar"), content = $("content"),
    countEl = $("count"), noteEl = $("note"), viewsEl = $("views"),
    btnFold = $("btnFold"), btnExport = $("btnExport"), btnExportMd = $("btnExportMd"),
    btnImport = $("btnImport"),
    btnDensity = $("btnDensity"), btnTop = $("btnTop"),
    fileImport = $("fileImport"), sideList = $("sideList"), catbar = $("catbar");

/* ---------- 提示条 ---------- */
var noteTimer = null;
/* 只用于我们自己拼的静态文案；任何来自文件/数据的内容都要先 esc() */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function note(html, kind){
  noteEl.className = "note " + (kind || "ok");
  noteEl.innerHTML = html;
  if (noteTimer) clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){ noteEl.className = "note hide"; }, 8000);
}

/* ---------- 高亮渲染（全程用 DOM 节点，不用 innerHTML 拼数据） ---------- */
function highlighted(text, terms, cls){
  var s = String(text == null ? "" : text);
  var span = el("span", cls);
  var ranges = C.matchRanges(s, terms);
  if (!ranges.length){ span.textContent = s; return span; }
  var pos = 0;
  ranges.forEach(function(r){
    if (r.start > pos) span.appendChild(document.createTextNode(s.slice(pos, r.start)));
    span.appendChild(el("mark", null, s.slice(r.start, r.end)));
    pos = r.end;
  });
  if (pos < s.length) span.appendChild(document.createTextNode(s.slice(pos)));
  return span;
}

/* ---------- 复制到剪贴板（clipboard API + 老浏览器兜底） ---------- */
function copyText(text, done){
  var ok = false;
  function fallback(){
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    done(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback);
  } else {
    fallback();
  }
}

/* ---------- 单张卡片 ---------- */
function buildCard(link, terms, meta){
  var a = el("a", "card");
  a.href = link.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.title = link.url;

  var hue = C.hueOf(link.name);
  var ico = el("span", "ico");
  ico.appendChild(document.createTextNode(C.initialOf(link.name)));
  ico.style.background = "hsl(" + hue + ", 70%, 92%)";
  ico.style.color = "hsl(" + hue + ", 55%, 32%)";
  /* favicon 走服务端同源代理；抓不到就藏掉，露出底下的首字母图标 */
  var fv = el("img", "icoimg");
  fv.loading = "lazy";
  fv.decoding = "async";
  fv.alt = "";
  fv.addEventListener("error", function(){ fv.style.display = "none"; });
  fv.src = "/api/favicon?url=" + encodeURIComponent(link.url);
  ico.appendChild(fv);
  a.appendChild(ico);

  var body = el("span", "body");
  var top = el("span", "top");
  top.appendChild(highlighted(link.name, terms, "nm"));
  body.appendChild(top);
  body.appendChild(highlighted(C.hostOf(link.url), terms, "url"));
  if (link.desc) body.appendChild(highlighted(link.desc, terms, "ds"));
  if (link.tip) body.appendChild(highlighted(link.tip, terms, "tip"));
  if (meta) body.appendChild(el("span", "tm", meta));

  if (link.tags && link.tags.length){
    var tg = el("span", "tg");
    link.tags.forEach(function(t){
      var chip = el("i", null, t);
      chip.title = "按标签筛选：" + t;
      chip.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        toggleTag(t);
      });
      tg.appendChild(chip);
    });
    body.appendChild(tg);
  }
  a.appendChild(body);

  /* 右上角操作组：复制 + 星标 */
  var acts = el("span", "acts");

  var copy = el("span", "copy", "复制");
  copy.title = "复制链接";
  copy.addEventListener("click", function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    copyText(link.url, function(ok){
      note(ok ? "已复制 <b>" + esc(link.url) + "</b>"
              : "复制失败，请手动选择网址复制", ok ? "ok" : "err");
    });
  });
  acts.appendChild(copy);

  var starred = state.stars.indexOf(link.url) !== -1;
  var star = el("span", "star" + (starred ? " on" : ""), starred ? "★" : "☆");
  star.title = starred ? "取消星标" : "加星标";
  star.addEventListener("click", function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    toggleStar(link.url);
  });
  acts.appendChild(star);
  a.appendChild(acts);

  a.addEventListener("click", function(){
    state.clicks[link.url] = (state.clicks[link.url] || 0) + 1;
    save("clicks", state.clicks);
    pushRecent(link.url);
  });

  return a;
}

/* ---------- 最近访问 ---------- */
function pushRecent(url){
  var list = state.recent.filter(function(r){ return r && r.url !== url; });
  list.unshift({ url: url, t: Date.now() });
  if (list.length > RECENT_MAX) list = list.slice(0, RECENT_MAX);
  state.recent = list;
  save("recent", list);
}

/* ---------- 分类筛选（桌面侧栏 + 移动端横滑条，同一套数据） ---------- */
function catButtons(){
  var wrap = document.createDocumentFragment();
  var all = el("button", "sideitem" + (state.cat ? "" : " active"));
  all.type = "button";
  all.appendChild(el("span", null, "全部分类"));
  all.appendChild(el("span", "n", String(C.countLinks(state.data))));
  all.addEventListener("click", function(){ setCat(""); });
  wrap.appendChild(all);
  C.categoriesOf(state.data).forEach(function(c){
    var b = el("button", "sideitem" + (state.cat === c.id ? " active" : ""));
    b.type = "button";
    b.title = c.name;
    b.appendChild(el("span", null, c.name));
    b.appendChild(el("span", "n", String((c.links || []).length)));
    b.addEventListener("click", function(){ setCat(c.id); });
    wrap.appendChild(b);
  });
  return wrap;
}
function setCat(id){
  state.cat = (id === state.cat) ? "" : id;
  render();
}
function renderCatNav(){
  sideList.textContent = "";
  sideList.appendChild(catButtons());
  catbar.textContent = "";
  catbar.appendChild(catButtons());
}

/* ---------- 标签条 ---------- */
function renderTagbar(){
  tagbar.textContent = "";
  var tags = C.collectTags(state.data);
  if (!tags.length) return;
  tags.forEach(function(item){
    var active = state.tags.indexOf(item.tag) !== -1;
    var chip = el("span", "chip" + (active ? " active" : ""));
    chip.appendChild(document.createTextNode(item.tag));
    chip.appendChild(el("span", "n", String(item.count)));
    chip.addEventListener("click", function(){ toggleTag(item.tag); });
    tagbar.appendChild(chip);
  });
  if (state.tags.length){
    var clear = el("button", "clear", "清除标签");
    clear.type = "button";
    clear.addEventListener("click", function(){ state.tags = []; render(); });
    tagbar.appendChild(clear);
  }
}

function toggleTag(t){
  var i = state.tags.indexOf(t);
  if (i === -1) state.tags.push(t); else state.tags.splice(i, 1);
  render();
}

function toggleStar(url){
  var i = state.stars.indexOf(url);
  if (i === -1) state.stars.push(url); else state.stars.splice(i, 1);
  save("stars", state.stars);
  render();
}

/* 把 fromId 分类拖到 toId 前面，顺序存本地（官方顺序仍在后台/links.js） */
function moveCategory(fromId, toId){
  var ids = C.categoriesOf(state.data).map(function(c){ return c.id; });
  var from = ids.indexOf(fromId), to = ids.indexOf(toId);
  if (from === -1 || to === -1) return;
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  state.order = ids;
  save("order", ids);
  state.data = C.applyOrder(state.data, ids);
  render();
}

/* ---------- 密度 ---------- */
function applyDensity(){
  document.body.classList.toggle("dense", state.density === "compact");
  btnDensity.textContent = state.density === "compact" ? "舒适模式" : "紧凑模式";
}
btnDensity.addEventListener("click", function(){
  state.density = state.density === "compact" ? "comfy" : "compact";
  save("density", state.density);
  applyDensity();
});

/* ---------- 主渲染 ---------- */
function render(){
  var terms = C.parseQuery(state.query);
  var cats = C.filterCategories(state.data, {
    query: state.query, tags: state.tags, view: state.view,
    cat: state.cat, stars: state.stars, clicks: state.clicks,
    recents: state.recent, recentLimit: RECENT_SHOW
  });
  var shown = cats.reduce(function(n, c){ return n + c.links.length; }, 0);
  var total = C.countLinks(state.data);

  renderTagbar();
  renderCatNav();

  /* 计数 */
  var catName = "";
  if (state.cat){
    C.categoriesOf(state.data).forEach(function(c){ if (c.id === state.cat) catName = c.name; });
  }
  if (state.query || state.tags.length || state.view !== "all" || state.cat){
    countEl.innerHTML = (catName ? "「" + esc(catName) + "」" : "") +
      "找到 <b>" + shown + "</b> 条 · 共 " + total + " 条";
  } else {
    countEl.innerHTML = "共 <b>" + total + "</b> 条";
  }

  /* 分类与卡片 */
  var recentAt = {};
  if (state.view === "recent"){
    state.recent.forEach(function(r){
      if (r && r.url && recentAt[r.url] == null) recentAt[r.url] = r.t;
    });
  }
  content.textContent = "";
  if (!shown){
    var empty = el("div", "empty");
    if (state.view === "star"){
      empty.innerHTML = "还没有星标站点。<br>把鼠标移到卡片右上角，点 ☆ 就能加星标。";
    } else if (state.view === "top"){
      empty.innerHTML = "还没有常用记录。<br>点开过的站点会按次数自动排到这里。";
    } else if (state.view === "recent"){
      empty.innerHTML = "还没有访问记录。<br>点开过的站点会按时间排到这里。";
    } else if (state.cat){
      empty.innerHTML = "这个分类下没有匹配的链接。<br>点「全部分类」看看别的。";
    } else {
      empty.innerHTML = "没有匹配的链接。<br>试试换个词，或者点上面的「清除标签」。";
    }
    content.appendChild(empty);
  } else {
    cats.forEach(function(cat){
      var sec = el("section", "cat");
      if (state.folded[cat.id]) sec.classList.add("folded");

      var h = el("h2", "cath");
      /* 桌面端拖拽分类标题调整顺序（触屏用侧栏/横滑条点选） */
      h.draggable = true;
      h.title = "拖拽调整分类顺序";
      h.addEventListener("dragstart", function(ev){
        ev.dataTransfer.setData("text/plain", cat.id);
        ev.dataTransfer.effectAllowed = "move";
        sec.classList.add("dragging");
      });
      h.addEventListener("dragend", function(){ sec.classList.remove("dragging"); });
      h.addEventListener("dragover", function(ev){
        ev.preventDefault();
        ev.dataTransfer.dropEffect = "move";
        sec.classList.add("dragover");
      });
      h.addEventListener("dragleave", function(){ sec.classList.remove("dragover"); });
      h.addEventListener("drop", function(ev){
        ev.preventDefault();
        sec.classList.remove("dragover");
        var from = ev.dataTransfer.getData("text/plain");
        if (from && from !== cat.id) moveCategory(from, cat.id);
      });
      var btn = el("button");
      btn.type = "button";
      btn.appendChild(document.createTextNode(cat.name));
      btn.appendChild(el("span", "n", String(cat.links.length)));
      btn.appendChild(el("span", "chev", "▾"));
      btn.addEventListener("click", function(){
        if (state.folded[cat.id]) delete state.folded[cat.id];
        else state.folded[cat.id] = 1;
        save("folded", state.folded);
        sec.classList.toggle("folded");
        syncFoldButton();
      });
      h.appendChild(btn);
      sec.appendChild(h);

      var grid = el("div", "grid");
      cat.links.forEach(function(l){
        grid.appendChild(buildCard(l, terms, recentAt[l.url] ? C.relTime(recentAt[l.url]) : ""));
      });
      sec.appendChild(grid);
      content.appendChild(sec);
    });
  }

  /* 搜索时默认选中第一条，方便直接回车打开 */
  sel = (state.query && shown) ? 0 : -1;
  paintSelection();
}

/* ---------- 选中态 ---------- */
function visibleCards(){
  return Array.prototype.slice.call(content.querySelectorAll("a.card"));
}
function paintSelection(){
  var cards = visibleCards();
  cards.forEach(function(c, i){ c.classList.toggle("sel", i === sel); });
  if (sel >= 0 && cards[sel]) cards[sel].scrollIntoView({ block: "nearest" });
}

/* ---------- 折叠 ---------- */
function anyExpanded(){
  return C.categoriesOf(state.data).some(function(c){ return !state.folded[c.id]; });
}
function syncFoldButton(){
  btnFold.textContent = anyExpanded() ? "折叠全部" : "展开全部";
}
btnFold.addEventListener("click", function(){
  var expand = !anyExpanded();
  state.folded = {};
  if (!expand) C.categoriesOf(state.data).forEach(function(c){ state.folded[c.id] = 1; });
  save("folded", state.folded);
  render();
  syncFoldButton();
});

/* ---------- 视图切换 ---------- */
viewsEl.addEventListener("click", function(e){
  var btn = e.target.closest("button[data-view]");
  if (!btn) return;
  state.view = btn.dataset.view;
  Array.prototype.forEach.call(viewsEl.querySelectorAll("button"), function(b){
    b.classList.toggle("active", b === btn);
  });
  render();
});

/* ---------- 搜索 ---------- */
qEl.addEventListener("input", function(){
  state.query = qEl.value;
  kbdHint.classList.toggle("hide", !!qEl.value);
  render();
});

/* ---------- 导出 / 导入 ---------- */
btnExport.addEventListener("click", function(){
  download(new Blob([C.serialize(state.data)], { type: "text/javascript;charset=utf-8" }), "links.js");
  note("已导出 links.js。改完直接覆盖仓库里的 nav/links.js 就行。", "ok");
});
btnExportMd.addEventListener("click", function(){
  download(new Blob([C.toMarkdown(state.data)], { type: "text/markdown;charset=utf-8" }), "links.md");
  note("已导出 Markdown 链接表（links.md），写博客时直接粘。", "ok");
});
btnImport.addEventListener("click", function(){ fileImport.click(); });
fileImport.addEventListener("change", function(){
  var f = fileImport.files && fileImport.files[0];
  if (!f) return;
  f.text().then(function(text){
    var data = C.parseImport(text);
    state.data = data;
    state.folded = {};
    sel = -1;
    render();
    syncFoldButton();
    note("已临时载入 <b>" + C.countLinks(data) + "</b> 条链接（刷新页面会恢复原样）。" +
         "要永久生效，把这份文件传到仓库的 <b>nav/links.js</b>。", "warn");
  }).catch(function(err){
    note("导入失败：" + esc(err && err.message ? err.message : "文件读不出来"), "err");
  }).then(function(){
    fileImport.value = "";
  });
});

/* ---------- 回到顶部 ---------- */
window.addEventListener("scroll", function(){
  btnTop.classList.toggle("show", (window.pageYOffset || document.documentElement.scrollTop) > 600);
}, { passive: true });
btnTop.addEventListener("click", function(){
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ---------- 键盘 ---------- */
document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName || "").toLowerCase();
  var typing = tag === "input" || tag === "textarea" || tag === "select";

  if (!typing && e.key === "/"){
    e.preventDefault(); qEl.focus(); qEl.select(); return;
  }
  if (e.key === "Escape"){
    if (qEl.value){ qEl.value = ""; state.query = ""; kbdHint.classList.remove("hide"); render(); }
    else qEl.blur();
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    if (typing && e.target !== qEl) return;
    var cards = visibleCards();
    if (!cards.length) return;
    e.preventDefault();
    if (sel < 0) sel = e.key === "ArrowDown" ? 0 : cards.length - 1;
    else sel = e.key === "ArrowDown" ? Math.min(sel + 1, cards.length - 1) : Math.max(sel - 1, 0);
    paintSelection();
    return;
  }
  if (e.key === "Enter" && sel >= 0){
    var cards2 = visibleCards();
    if (cards2[sel]){ e.preventDefault(); cards2[sel].click(); }
  }
});

/* ---------- 启动 ---------- */
/* ---------- 数据来源 ----------
   优先用数据库里的内容（在 admin 里改的），
   接口不可用或还没数据时，回落到 links.js 里的静态数据。
   这样即使接口挂了、或者本地双击打开，页面照样能看。 */
function applyData(data){
  state.data = C.applyOrder(data, state.order);
  $("total").textContent = C.countLinks(state.data);
  $("totalCat").textContent = C.categoriesOf(state.data).length;
  render();
  syncFoldButton();
}

function navFromApi(j){
  var cats = (j.categories || []);
  var links = (j.links || []);
  return {
    categories: cats.map(function(c){
      return {
        id: "c" + c.id,
        name: c.data.name,
        links: links.filter(function(l){ return l.parent_id === c.id; })
          .map(function(l){
            return { name: l.data.name, url: l.data.url, desc: l.data.desc, tip: l.data.tip,
                     tags: l.data.tags || [], keywords: l.data.keywords || [] };
          })
      };
    }).filter(function(c){ return c.links.length; })
  };
}

(function boot(){
  var hasStatic = window.NAV_DATA && Array.isArray(window.NAV_DATA.categories);
  if (!hasStatic){
    content.appendChild(el("div", "empty")).innerHTML =
      "读不到链接数据。<br>请确认 <b>nav/links.js</b> 和本页在同一个目录，并且已经被加载。";
    $("total").textContent = "0";
    $("totalCat").textContent = "0";
    return;
  }

  /* 先用静态数据渲染，避免等接口时白屏 */
  applyData(window.NAV_DATA);
  applyDensity();

  if (!window.fetch) return;
  fetch("/api/content?type=nav", { headers: { Accept: "application/json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !(j.categories || []).length) return;   // 数据库里还没内容，保持静态
      var d = navFromApi(j);
      if (d.categories.length) applyData(d);
    })
    .catch(function(){ /* 接口不可用，静默保留静态数据 */ });
})();

})();
</script>
<script src="../shell.js"></script>
</body>
</html>
