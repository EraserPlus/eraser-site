<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* 尽早定主题，避免闪白；没存过就跟随系统偏好（切换按钮与命令面板见 shell.js） */
(function(){try{var t=localStorage.getItem("eraser.theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>学习地图 · Eraser 的小站</title>
<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<meta name="theme-color" content="#2563eb">
<style>
/* 学习地图页专属样式：地图卡 / 进度条 / 节点列表 / 分组 */
.lm-sec { margin-top: 30px; }
.lm-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }

/* 地图卡（列表） */
.lm-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; margin-bottom: 12px;
}
.lm-card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lm-card .ttl { font-weight: 600; font-size: 15px; word-break: break-word; }
.lm-card .ttl a { color: inherit; }
.lm-card .ttl a:hover { color: var(--blue); }
.lm-card .dsc { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-word; }

/* 进度条 */
.lm-bar { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; margin-top: 10px; }
.lm-bar > i { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width .25s; }
.lm-card .pmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }

/* 详情视图 */
.lm-back { display: inline-block; margin: 4px 0 14px; font-size: 13px; color: var(--blue); cursor: pointer; }
.lm-back:hover { text-decoration: underline; }
.lm-grp { margin-top: 22px; }
.lm-grp > h3 {
  font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.lm-grp > h3 .gcnt { font-weight: normal; font-size: 12px; }
.lm-node {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  margin-bottom: 7px; background: var(--card);
}
.lm-node .chk { flex-shrink: 0; margin-top: 2px; }
.lm-node .txt { flex: 1; min-width: 0; word-break: break-word; }
.lm-node .nt { color: var(--muted); font-size: 12px; margin-top: 3px; word-break: break-word; }
.lm-node.done { opacity: .62; }
.lm-node.done .txt { text-decoration: line-through; text-decoration-color: var(--line2); }
.lm-status { font-size: 12px; color: var(--muted); }

@media (max-width: 560px) {
  .lm-card .top { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="navbar">
  <span class="logo">🧩 Eraser 的小站</span>
  <nav>
    <a href="../index.html">搜索</a>
    <a href="../tools/index.html">工具箱</a>
    <a href="../blog/index.html">博客</a>
    <a href="../collect/index.html">追更</a>
    <a href="index.html" class="active">学习</a>
    <a href="../nav/index.html">导航</a>
    <a href="../about/index.html">关于</a>
  </nav>
</div>
<div class="container">
  <h1>学习地图</h1>
  <p class="muted">把要学的东西拆成节点，一个个勾掉。也可以让 AI 助手帮你建图、查漏补缺。</p>

  <!-- 列表视图 -->
  <section class="lm-sec" id="viewList">
    <div class="lm-head"><h2 style="font-size:18px;margin:0">我的地图</h2><span class="lm-status" id="listCount"></span></div>
    <!-- 数据库里还没内容时保留这段静态兜底，别删 -->
    <p class="muted" id="listEmpty">数据库里还没内容。去管理后台的「学习」标签新建一张地图，或者让 AI 助手帮你建。</p>
    <div id="listHost"></div>
  </section>

  <!-- 详情视图 -->
  <section class="lm-sec" id="viewDetail" style="display:none">
    <span class="lm-back" id="btnBack">← 返回地图列表</span>
    <div class="lm-card" id="detailHead"></div>
    <div id="nodeHost"></div>
  </section>
</div>

<script>
/* 学习地图：先静态兜底 → 再读接口渲染 → 失败保持静态，永不白屏。
   勾选完成走 /api/learn?action=toggleNode，需要登录令牌；未登录时复选框禁用，
   避免点了没反应让人困惑。令牌存在 localStorage 的 eraser.admin.token（后台登录后写入）。 */
(function () {
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function token() {
    try { return localStorage.getItem("eraser.admin.token") || ""; } catch (e) { return ""; }
  }
  function api(path, opts) {
    opts = opts || {};
    var h = { Accept: "application/json" };
    if (token()) h.Authorization = "Bearer " + token();
    if (opts.body) h["Content-Type"] = "application/json";
    return fetch(path, {
      method: opts.method || "GET",
      headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || "请求失败");
        return j;
      });
    });
  }

  /* 当前状态：地图列表 / 选中的地图 */
  var maps = [];
  var current = null;

  function pct(p) { return Math.max(0, Math.min(100, Number(p) || 0)); }

  function makeMapCard(m) {
    var card = el("div", "lm-card");
    var top = el("div", "top");
    var ttl = el("div", "ttl");
    var a = el("a", null, m.title || "(未命名地图)");
    a.href = "?id=" + m.id;
    a.addEventListener("click", function (ev) { ev.preventDefault(); openMap(m.id); });
    ttl.appendChild(a);
    top.appendChild(ttl);
    var st = { active: "在学", done: "学完", archived: "归档" }[m.status];
    if (st) top.appendChild(el("span", "lm-status", st));
    card.appendChild(top);
    if (m.desc) card.appendChild(el("div", "dsc", m.desc));

    var p = m.progress || { total: 0, done: 0, percent: 0 };
    var bar = el("div", "lm-bar");
    var fill = el("i");
    fill.style.width = pct(p.percent) + "%";
    bar.appendChild(fill);
    card.appendChild(bar);

    var meta = el("div", "pmeta");
    meta.appendChild(el("span", null, "完成 " + (p.done || 0) + " / " + (p.total || 0) + " 个节点"));
    meta.appendChild(el("span", null, pct(p.percent) + "%"));
    card.appendChild(meta);
    return card;
  }

  function renderList() {
    var host = $("listHost"), empty = $("listEmpty");
    host.innerHTML = "";
    $("listCount").textContent = maps.length ? "共 " + maps.length + " 张" : "";
    if (!maps.length) { empty.style.display = ""; return; }
    empty.style.display = "none";
    maps.forEach(function (m) { host.appendChild(makeMapCard(m)); });
  }

  /* 组内节点顺序保持原样，分组按首次出现顺序 */
  function groupNodes(nodes) {
    var order = [], byKey = {};
    nodes.forEach(function (n) {
      var g = (n && n.group) || "未分组";
      if (!byKey[g]) { byKey[g] = []; order.push(g); }
      byKey[g].push(n);
    });
    return order.map(function (g) { return { name: g, nodes: byKey[g] }; });
  }

  function makeNode(n) {
    var row = el("div", "lm-node" + (n.done ? " done" : ""));
    var chk = el("input", "chk");
    chk.type = "checkbox";
    chk.checked = !!n.done;
    chk.disabled = !token();
    if (!token()) chk.title = "勾选需要先在后台登录";
    chk.addEventListener("change", function () {
      chk.disabled = true;
      api("/api/learn?action=toggleNode", { method: "POST", body: { id: current.id, nodeId: n.id } })
        .then(function (j) {
          n.done = !n.done;
          row.classList.toggle("done", n.done);
          /* 用服务端返回的进度刷新头部，避免本地算错 */
          if (j && j.progress) paintDetailHead(j.progress);
        })
        .catch(function (e) {
          chk.checked = !chk.checked;   /* 回滚 */
          alert(e.message || "操作失败");
        })
        .then(function () { chk.disabled = false; });
    });
    row.appendChild(chk);

    var box = el("div", "txt");
    box.appendChild(el("div", null, n.text || ""));
    if (n.note) box.appendChild(el("div", "nt", n.note));
    row.appendChild(box);
    return row;
  }

  function paintDetailHead(p) {
    var head = $("detailHead");
    head.innerHTML = "";
    var top = el("div", "top");
    top.appendChild(el("div", "ttl", current.title || "(未命名地图)"));
    var st = { active: "在学", done: "学完", archived: "归档" }[current.status];
    if (st) top.appendChild(el("span", "lm-status", st));
    head.appendChild(top);
    if (current.desc) head.appendChild(el("div", "dsc", current.desc));

    var bar = el("div", "lm-bar");
    var fill = el("i");
    fill.style.width = pct(p.percent) + "%";
    bar.appendChild(fill);
    head.appendChild(bar);

    var meta = el("div", "pmeta");
    meta.appendChild(el("span", null, "完成 " + p.done + " / " + p.total + " 个节点"));
    meta.appendChild(el("span", null, pct(p.percent) + "%"));
    head.appendChild(meta);
  }

  function renderDetail(item, progress) {
    current = item.data ? Object.assign({ id: item.id }, item.data) : item;
    var nodes = (current.nodes || []);
    paintDetailHead(progress || { done: 0, total: nodes.length, percent: 0 });

    var host = $("nodeHost");
    host.innerHTML = "";
    if (!nodes.length) {
      host.appendChild(el("p", "muted", "这张地图还没有节点。去后台加，或者让 AI 助手帮你拆解。"));
      return;
    }
    groupNodes(nodes).forEach(function (g) {
      var sec = el("div", "lm-grp");
      var h = el("h3");
      h.appendChild(el("span", null, g.name));
      var doneN = g.nodes.filter(function (n) { return n.done; }).length;
      h.appendChild(el("span", "gcnt", doneN + " / " + g.nodes.length));
      sec.appendChild(h);
      g.nodes.forEach(function (n) { sec.appendChild(makeNode(n)); });
      host.appendChild(sec);
    });
  }

  function showList() {
    $("viewDetail").style.display = "none";
    $("viewList").style.display = "";
    if (location.search) history.replaceState(null, "", location.pathname);
  }

  function openMap(id) {
    api("/api/learn?id=" + encodeURIComponent(id))
      .then(function (j) {
        $("viewList").style.display = "none";
        $("viewDetail").style.display = "";
        renderDetail(j.item, j.progress);
        history.replaceState(null, "", "?id=" + encodeURIComponent(id));
        window.scrollTo(0, 0);
      })
      .catch(function (e) { alert(e.message || "打不开这张地图"); });
  }

  $("btnBack").addEventListener("click", showList);

  if (!window.fetch) return;
  api("/api/learn")
    .then(function (j) {
      maps = (j && j.items) || [];
      renderList();
      var id = new URLSearchParams(location.search).get("id");
      if (id) openMap(id);
    })
    .catch(function () { /* 接口挂了：保持静态空状态，不白屏 */ });
})();
</script>
<script src="../shell.js"></script>
</body>
</html>
