<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eraser 的小站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
  <span class="logo">🧩 Eraser 的小站</span>
  <nav>
    <a href="index.html" class="active">首页</a>
    <a href="search/index.html">搜索</a>
    <a href="tools/index.html">工具箱</a>
    <a href="blog/index.html">博客</a>
    <a href="collect/index.html">追更</a>
    <a href="nav/index.html">导航</a>
    <a href="about/index.html">关于</a>
  </nav>
</div>
<div class="container">
  <h1 id="welcomeTitle">你好，我是 Eraser 👋</h1>
  <p class="muted" id="welcomeText">这是一个跑在 Vercel 上的纯静态小站，放些工具、文件和随笔。</p>

  <div class="cards">
    <a href="tools/index.html" style="color:inherit"><div class="card">
      <h3>🧰 工具箱</h3><p>密码生成、JSON 格式化等纯前端小工具。</p>
    </div></a>
    <a href="search/index.html" style="color:inherit"><div class="card">
      <h3>🔍 全站搜索</h3><p>一次搜遍导航链接、博客文章和页面。</p>
    </div></a>
    <a href="blog/index.html" style="color:inherit"><div class="card">
      <h3>✏️ 博客</h3><p>学习笔记和踩坑记录。</p>
    </div></a>
    <a href="collect/index.html" style="color:inherit"><div class="card">
      <h3>📺 追更</h3><p>追番和漫画的留档，看过的都记在这。</p>
    </div></a>
    <a href="nav/index.html" style="color:inherit"><div class="card">
      <h3>🧭 网址导航</h3><p>我常用的网站快速入口。</p>
    </div></a>
  </div>
</div>

<script src="md.js"></script>
<script>
/* 首页欢迎语可以在管理后台的「页面」标签里改（标识 home）。
   接口不可用时保留上面的静态文字，页面永远不会白屏。 */
(function(){
  var h = document.getElementById("welcomeTitle");
  var p = document.getElementById("welcomeText");
  if (!window.fetch || !h || !p) return;

  fetch("/api/content?type=page", { headers: { Accept: "application/json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var items = (j && j.items) || [];
      var page = null;
      for (var i = 0; i < items.length; i++){
        if (items[i].data && items[i].data.key === "home"){ page = items[i]; break; }
      }
      if (!page) return;

      h.textContent = page.data.title;
      if (window.MD) p.innerHTML = MD.render(page.data.content);
    })
    .catch(function(){ /* 保留静态兜底 */ });
})();
</script>
</body>
</html>
