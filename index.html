<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全站搜索 · Eraser 小站</title>
<script>
/* 尽早定主题，避免闪白；没存过就跟随系统偏好（切换按钮与命令面板见 shell.js） */
(function(){try{var t=localStorage.getItem("eraser.theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<link rel="stylesheet" href="style.css">
<style>
/* 本页只写 style.css 里没有的样式；导航栏、容器基础一律交给 style.css */
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff6ff;
  --ink:#24292f; --muted:#6b7280; --line:#e5e7eb;
  --bg:#f5f6f8; --card:#ffffff;
  --red:#dc2626; --red-l:#fef2f2; --green:#16a34a; --green-l:#f0fdf4;
  --amber:#b45309; --amber-l:#fffbeb;
  --mark:#fde68a;
}
body{ font-size:15px; -webkit-font-smoothing:antialiased; }
.container{ max-width:860px; margin:0 auto; padding:28px 20px 80px; }
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.2px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13.5px}

/* 搜索 */
.searchwrap{position:relative;margin-bottom:12px}
#q{
  width:100%;padding:13px 46px 13px 40px;border:1px solid var(--line);border-radius:11px;
  font-family:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none;
}
#q:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.searchwrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.searchwrap kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-family:inherit;font-size:11.5px;color:var(--muted);background:#f1f5f9;
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;pointer-events:none;
}

/* 示例词 / 搜索历史 */
.exbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.exbar .lab{font-size:12.5px;color:var(--muted)}
.chip{
  font-size:12.5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--muted);cursor:pointer;user-select:none;
}
.chip:hover{border-color:#cbd5e1;color:var(--ink)}
#hist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
#hist .lab{font-size:12.5px;color:var(--muted)}
#hist .clr{font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;text-decoration:underline}
#hist .clr:hover{color:var(--red)}

/* 分区 tab */
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tab{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 12px;border-radius:20px;
  border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;user-select:none;
}
.tab:hover{border-color:#cbd5e1;color:var(--ink)}
.tab.on{background:var(--blue-l);border-color:#bfdbfe;color:var(--blue-d);font-weight:600}
.tab .n{font-size:11px;color:var(--muted);background:#f1f5f9;border-radius:20px;padding:0 7px}
.tab.on .n{background:#fff;color:var(--blue-d)}

.count{font-size:12.5px;color:var(--muted);margin:4px 0 14px}
.count b{color:var(--ink);font-weight:600}

/* 结果 */
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:600;color:var(--ink)}
.grp-h .n{font-size:12px;font-weight:400;color:var(--muted);background:#f1f5f9;border-radius:20px;padding:1px 9px}
a.hit{
  display:block;padding:12px 14px;margin-bottom:8px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s;
}
a.hit:hover{border-color:#bfdbfe;box-shadow:0 1px 3px rgba(15,23,42,.06);text-decoration:none}
a.hit.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
a.hit .t{font-weight:600;font-size:14.5px;color:var(--ink)}
a.hit .d{font-size:12.5px;color:var(--muted);margin-top:2px}
a.hit .u{font-size:11.5px;color:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz{font-size:10.5px;font-weight:400;color:var(--amber);background:var(--amber-l);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* 加载更多 */
.more{text-align:center;margin:6px 0 14px}
.morebtn{
  font-family:inherit;font-size:13px;color:var(--blue);background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:7px 18px;cursor:pointer;
}
.morebtn:hover{border-color:var(--blue);background:var(--blue-l)}

/* 空状态 / 提示 */
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px;line-height:2}
.empty b{color:var(--ink)}
.note{font-size:13px;border-radius:9px;padding:11px 14px;margin:0 0 16px;border:1px solid}
.note.ok{background:var(--green-l);border-color:#bbf7d0;color:#14532d}
.note.err{background:var(--red-l);border-color:#fecaca;color:#7f1d1d}
.note.hide{display:none}
#hist.hide,#tabs.hide,.more.hide{display:none}
.footnote{color:var(--muted);font-size:12.5px;text-align:center;margin-top:34px;line-height:1.9}
.footnote code{background:#f1f5f9;border-radius:4px;padding:1px 5px;font-size:12px}

@media(max-width:600px){
  #q{font-size:16px}   /* iOS 聚焦不自动放大 */
  .container{padding:20px 14px 64px}
}

/* ===== 暗色：手动切换（html[data-theme="dark"]）===== */
html[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --sunk:#1c2128;
  --ink:#e6edf3; --muted:#7d8590; --line:#272c33;
  --blue:#60a5fa; --blue-d:#3b82f6; --blue-l:#16233a;
  --red:#ff7b72; --red-l:#2d1517;
  --green:#3fb950; --green-l:#0f2417;
  --amber:#d29922; --amber-l:#2b2210;
  --mark:#713f12;
}
html[data-theme="dark"] #q{ background:var(--card); }
html[data-theme="dark"] .chip{ background:var(--card); }
html[data-theme="dark"] .grp-h .n{ background:var(--sunk); }
html[data-theme="dark"] a.hit:hover{ border-color:#1e3a5f; }
html[data-theme="dark"] a.hit.active{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(96,165,250,.18); }
html[data-theme="dark"] a.hit .u{ color:var(--muted); }
html[data-theme="dark"] .footnote code{ background:var(--sunk); }
html[data-theme="dark"] .searchwrap kbd{ background:var(--sunk); }
html[data-theme="dark"] .note.err{ border-color:#4a1f1f; color:var(--red); }
html[data-theme="dark"] .tab{ background:var(--card); }
html[data-theme="dark"] .tab .n{ background:var(--sunk); }
html[data-theme="dark"] .tab.on .n{ background:var(--card); }
html[data-theme="dark"] .morebtn{ background:var(--card); color:var(--blue); }
html[data-theme="dark"] .morebtn:hover{ background:var(--blue-l); }
</style>
</head>
<body>

  <span class="logo">🧩 Eraser 的小站</span>

<div class="container">
  <h1>全站搜索</h1>
  <p class="sub">搜导航链接、博客文章、追更、学习地图的标题和摘要</p>

  <div class="searchwrap">
    <span class="ico">⌕</span>
    <input id="q" type="text" placeholder="搜链接、文章标题、追更、学习地图……" autocomplete="off" spellcheck="false" autocapitalize="off">
    <kbd>Enter</kbd>
  </div>

  <div class="exbar" id="exbar"><span class="lab">试试：</span></div>
  <div id="hist" class="hide"></div>
  <div id="tabs" class="hide"></div>
  <div class="count" id="count"></div>
  <div class="note hide" id="note"></div>
  <div id="list"></div>
  <div class="more hide" id="more"></div>

  <p class="footnote">
    <code>Enter</code> 搜索 · <code>↑</code><code>↓</code> 选结果再 <code>Enter</code> 打开 · <code>Esc</code> 清空<br>
    接口不可用时保留静态提示，不白屏；导航页有自己的离线搜索，断网也能用
  </p>
</div>

<script>
/* 全站搜索（现为首页）：输入关键词 → 同源 /api/search → 分组渲染。
   全程 DOM/textContent 拼结果，只有静态文案才用 innerHTML。
   M7 增强：↑↓ 选结果、搜索历史、分区 tab、加载更多、模糊命中标记。 */
(function(){
"use strict";

function $(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function toggleHide(node, hide){
  if (hide) node.classList.add("hide"); else node.classList.remove("hide");
}

var qEl = $("q"), exbar = $("exbar"), histEl = $("hist"), tabsEl = $("tabs"),
    countEl = $("count"), noteEl = $("note"), listEl = $("list"), moreEl = $("more");
var noteTimer = null;

/* 每页展示的结果条数；「加载更多」按这个粒度往上加 */
var PAGE = 8;

/* 视图状态：当前词、全部结果、选中分区、已展示条数 */
var state = { q: "", results: [], tab: "all", shown: PAGE };
/* 当前 DOM 里的结果链接（跟页面视觉顺序一致，供 ↑↓ 键盘选择） */
var hitEls = [], activeIdx = -1;

function note(html, kind){
  noteEl.className = "note " + (kind || "ok");
  noteEl.innerHTML = html;
  if (noteTimer) clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){ noteEl.className = "note hide"; }, 8000);
}

/* 命中词高亮：按区间切段，全部走 DOM 节点 */
function hl(text, terms){
  var s = String(text == null ? "" : text);
  var span = el("span");
  if (!terms.length){ span.textContent = s; return span; }
  var low = s.toLowerCase();
  var ranges = [];
  terms.forEach(function(t){
    if (!t) return;
    var from = 0, idx;
    while ((idx = low.indexOf(t, from)) !== -1){
      ranges.push([idx, idx + t.length]);
      from = idx + t.length;
    }
  });
  if (!ranges.length){ span.textContent = s; return span; }
  ranges.sort(function(a, b){ return a[0] - b[0] || b[1] - a[1]; });
  var merged = [ranges[0]];
  for (var i = 1; i < ranges.length; i++){
    var last = merged[merged.length - 1], cur = ranges[i];
    if (cur[0] <= last[1]) last[1] = Math.max(last[1], cur[1]);
    else merged.push(cur);
  }
  var pos = 0;
  merged.forEach(function(r){
    if (r[0] > pos) span.appendChild(document.createTextNode(s.slice(pos, r[0])));
    span.appendChild(el("mark", null, s.slice(r[0], r[1])));
    pos = r[1];
  });
  if (pos < s.length) span.appendChild(document.createTextNode(s.slice(pos)));
  return span;
}

/* ------------------------------------------------ 搜索历史（localStorage） */
var HKEY = "eraser.search.history", HMAX = 8;

function loadHist(){
  try{
    var a = JSON.parse(localStorage.getItem(HKEY) || "[]");
    if (!Array.isArray(a)) return [];
    return a.filter(function(x){ return typeof x === "string" && x; }).slice(0, HMAX);
  }catch(e){ return []; }
}
function saveHist(q){
  try{
    var a = loadHist().filter(function(x){ return x !== q; });
    a.unshift(q);
    localStorage.setItem(HKEY, JSON.stringify(a.slice(0, HMAX)));
  }catch(e){ /* 隐私模式或存储已满：忽略，不影响搜索 */ }
}
function renderHist(){
  histEl.textContent = "";
  var list = loadHist();
  if (!list.length){ toggleHide(histEl, true); return; }
  histEl.appendChild(el("span", "lab", "最近搜过："));
  list.forEach(function(w){
    var c = el("span", "chip", w);
    c.addEventListener("click", function(){ qEl.value = w; doSearch(w); });
    histEl.appendChild(c);
  });
  var clr = el("span", "clr", "清空");
  clr.addEventListener("click", function(){
    try{ localStorage.removeItem(HKEY); }catch(e){}
    renderHist();
  });
  histEl.appendChild(clr);
  toggleHide(histEl, false);
}

/* 静态提示：没搜词时的引导，接口挂也能看 */
function showIdle(){
  state = { q: "", results: [], tab: "all", shown: PAGE };
  hitEls = []; activeIdx = -1;
  countEl.innerHTML = "";
  listEl.textContent = "";
  moreEl.textContent = ""; toggleHide(moreEl, true);
  tabsEl.textContent = ""; toggleHide(tabsEl, true);
  var empty = el("div", "empty");
  empty.innerHTML = "输入关键词，回车开始搜索。<br>能搜：<b>导航链接</b>（名称/网址/说明/标签/关键词）、<b>博客文章</b>（标题/摘要/标签）、<b>追更</b>（名称/备注/链接）、<b>学习地图</b>（标题/说明）。<br><span style=\"color:#94a3b8\">只搜标题和摘要，不搜正文——不然结果太乱。想按正文找，进文章里用 Ctrl+F。</span>";
  listEl.appendChild(empty);
  renderHist();
}

var GROUPS = [
  { type: "nav_link",  icon: "🔗", name: "导航链接" },
  { type: "post",      icon: "✏️", name: "博客文章" },
  { type: "media",     icon: "📺", name: "追更" },
  { type: "learn_map", icon: "🗺️", name: "学习地图" },
  { type: "page",      icon: "📄", name: "页面" }
];

function hit(it, terms){
  var a = el("a", "hit");
  a.href = it.url;
  if (/^https?:\/\//.test(it.url)){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
  var t = el("div", "t");
  t.appendChild(hl(it.title, terms));
  if (it.fuzzy) t.appendChild(el("span", "fz", "模糊"));
  a.appendChild(t);
  if (it.desc){
    var d = el("div", "d");
    d.appendChild(hl(it.desc, terms));
    a.appendChild(d);
  }
  a.appendChild(el("div", "u", it.url));
  return a;
}

/* 键盘选中：循环移动，并把当前项滚进可视区 */
function setActive(i){
  if (!hitEls.length) return;
  if (i < 0) i = hitEls.length - 1;
  if (i >= hitEls.length) i = 0;
  if (activeIdx >= 0 && hitEls[activeIdx]) hitEls[activeIdx].classList.remove("active");
  activeIdx = i;
  var cur = hitEls[activeIdx];
  cur.classList.add("active");
  if (cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
}

/* 按当前 state 重画：分区 tab → 结果分组（只画前 shown 条）→ 加载更多 */
function render(){
  var all = state.results, q = state.q;
  var terms = String(q || "").toLowerCase().split(/\s+/).filter(Boolean);
  hitEls = []; activeIdx = -1;
  listEl.textContent = "";
  tabsEl.textContent = ""; toggleHide(tabsEl, true);
  moreEl.textContent = ""; toggleHide(moreEl, true);

  if (!all.length){
    countEl.innerHTML = "没有找到与 <b>" + esc(q) + "</b> 相关的内容";
    var empty = el("div", "empty");
    empty.innerHTML = "换个词试试。<br>导航页还有一份<b>离线搜索</b>（断网也能用），点顶部「导航」。";
    listEl.appendChild(empty);
    return;
  }

  countEl.innerHTML = "找到 <b>" + all.length + "</b> 条与「" + esc(q) + "」相关的内容";

  /* 分区 tab：全部 + 有结果的分区 */
  var counts = {};
  all.forEach(function(r){ counts[r.type] = (counts[r.type] || 0) + 1; });
  var defs = [{ type: "all", icon: "", name: "全部" }].concat(GROUPS);
  defs.forEach(function(g){
    var n = g.type === "all" ? all.length : (counts[g.type] || 0);
    if (!n) return;
    var t = el("span", "tab" + (state.tab === g.type ? " on" : ""));
    t.appendChild(document.createTextNode((g.icon ? g.icon + " " : "") + g.name));
    t.appendChild(el("span", "n", String(n)));
    t.addEventListener("click", function(){ state.tab = g.type; state.shown = PAGE; render(); });
    tabsEl.appendChild(t);
  });
  toggleHide(tabsEl, false);

  /* 分区过滤 + 分批展示（分组顺序固定，保证视觉顺序与 hitEls 一致） */
  var filtered = state.tab === "all" ? all : all.filter(function(r){ return r.type === state.tab; });
  var visible = filtered.slice(0, state.shown);

  GROUPS.forEach(function(g){
    var items = visible.filter(function(r){ return r.type === g.type; });
    if (!items.length) return;
    var grp = el("div", "grp");
    var h = el("div", "grp-h");
    h.appendChild(el("span", null, g.icon + " " + g.name));
    h.appendChild(el("span", "n", String(items.length)));
    grp.appendChild(h);
    items.forEach(function(it){
      var a = hit(it, terms);
      hitEls.push(a);
      grp.appendChild(a);
    });
    listEl.appendChild(grp);
  });

  var rest = filtered.length - visible.length;
  if (rest > 0){
    var btn = el("button", "morebtn", "加载更多（还剩 " + rest + " 条）");
    btn.type = "button";
    btn.addEventListener("click", function(){ state.shown += PAGE; render(); });
    moreEl.appendChild(btn);
    toggleHide(moreEl, false);
  }
}

function showResults(q, results){
  state = { q: q, results: results, tab: "all", shown: PAGE };
  render();
}

function doSearch(q){
  q = String(q || "").trim();
  if (!q){ showIdle(); return; }
  toggleHide(histEl, true);
  if (!window.fetch){ note("当前浏览器太老，不支持在线搜索", "err"); return; }
  /* 一个字的词命中面太大，本地先拦掉，省一次请求 */
  if (q.length < 2){
    note("再打一个字吧，一个字搜出来的东西太多", "warn");
    showIdle();
    qEl.value = q;
    return;
  }
  fetch("/api/search?q=" + encodeURIComponent(q), { headers: { Accept: "application/json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j){ note("搜索服务开小差了，稍后再试", "err"); return; }
      if (j.tooShort){ note("再打一个字吧，一个字搜出来的东西太多", "warn"); return; }
      saveHist(q);
      showResults(j.q || q, j.results || []);
    })
    .catch(function(){ note("搜索服务开小差了，稍后再试（本页静态提示仍可用）", "err"); });
}

/* 示例词 */
["git", "工具", "密码", "Vercel"].forEach(function(w){
  var chip = el("span", "chip", w);
  chip.addEventListener("click", function(){
    qEl.value = w;
    doSearch(w);
  });
  exbar.appendChild(chip);
});

/* 键盘：↑↓ 选结果、Enter 打开/搜索、Esc 清空 */
qEl.addEventListener("keydown", function(e){
  if (e.key === "ArrowDown"){ e.preventDefault(); setActive(activeIdx + 1); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); setActive(activeIdx - 1); }
  else if (e.key === "Enter"){
    if (activeIdx >= 0 && hitEls[activeIdx]){ e.preventDefault(); hitEls[activeIdx].click(); }
    else doSearch(qEl.value);
  }
  else if (e.key === "Escape"){ qEl.value = ""; showIdle(); }
});
qEl.addEventListener("input", function(){
  if (!qEl.value) showIdle();
});

/* 从网址带 q 参数进来时直接搜（站内其它页面可以链到 /?q=xxx） */
function param(name){
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}
var q0 = param("q");
if (q0){ qEl.value = q0; doSearch(q0); }
else showIdle();
qEl.focus();

})();
</script>
<script src="shell.js"></script>
</body>
