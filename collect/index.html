<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* 尽早定主题，避免闪白；没存过就跟随系统偏好（切换按钮与命令面板见 shell.js） */
(function(){try{var t=localStorage.getItem("eraser.theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>追更 · Eraser 的小站</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../owner.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="Eraser 的追更留档：正在追的番剧与漫画，带评分、进度和状态，看完自动收进收纳栏。">
<!-- 分享卡片（og / twitter）：贴到聊天工具里能出预览 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Eraser 的小站">
<meta property="og:title" content="追更 · Eraser 的小站">
<meta property="og:description" content="Eraser 的追更留档：正在追的番剧与漫画，带评分、进度和状态，看完自动收进收纳栏。">
<meta property="og:url" content="https://eraser.de5.net/collect/">
<meta property="og:image" content="https://eraser.de5.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ===== 追更页：海报墙（参考 dudulu.moe 的版式，配色沿用全站蓝） ===== */

/* 页头 */
.mg-top { margin-top: 4px; }
.mg-top h1 { margin-bottom: 6px; }

/* 快速添加（只在登录后出现） */
.mg-add {
  margin-top: 10px; border: 1px solid var(--blue); background: var(--blue); color: #fff;
  border-radius: 9px; padding: 7px 15px; font-size: 13px; font-family: inherit;
  cursor: pointer; font-weight: 600;
}
.mg-add:hover { filter: brightness(1.06); }

/* 快速添加弹层 */
.mg-modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200;
            display: flex; align-items: center; justify-content: center; padding: 16px; }
.mg-modal .panel { background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
                   width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
                   padding: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.24); }
.mg-modal h3 { margin: 0 0 4px; font-size: 16px; }
.mg-modal .mhint { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.mg-modal label { display: block; font-size: 12.5px; color: var(--ink3); margin: 10px 0 4px; }
.mg-modal input, .mg-modal select {
  width: 100%; box-sizing: border-box; padding: 8px 11px; font-size: 13.5px; font-family: inherit;
  border: 1px solid var(--line2); border-radius: 9px; background: var(--card); color: var(--ink);
}
.mg-modal input:focus, .mg-modal select:focus {
  outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-l);
}
.mg-modal .two { display: flex; gap: 10px; }
.mg-modal .two > div { flex: 1; min-width: 0; }
.mg-modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.mg-modal .acts button {
  border: 1px solid var(--line2); background: var(--card); color: var(--ink2);
  border-radius: 9px; padding: 8px 16px; font-size: 13.5px; font-family: inherit; cursor: pointer;
}
.mg-modal .acts button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.mg-modal .acts button:disabled { opacity: .5; cursor: not-allowed; }
.mg-modal .mmsg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
.mg-modal .mmsg.err { color: var(--red); }
.mg-modal .mmsg.ok { color: var(--green); }
.mg-modal .mfill { display: flex; gap: 8px; align-items: flex-end; }
.mg-modal .mfill > div { flex: 1; min-width: 0; }
.mg-modal .mfill button {
  border: 1px solid var(--line2); background: var(--card); color: var(--ink2);
  border-radius: 9px; padding: 8px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
  white-space: nowrap;
}
.mg-modal .mfill button:hover { border-color: var(--blue); color: var(--blue); }

/* 顶部统计条 */
.mg-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.mg-stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 16px; min-width: 84px;
}
.mg-stat b { display: block; font-size: 20px; line-height: 1.25; color: var(--blue); }
.mg-stat span { font-size: 12px; color: var(--muted); }
/* 带 «» 的次要统计（搁置/已看完）稍淡一档，但暗色下 --ink4(#8b949e) 偏灰，
   提亮到 --ink2 保证能看清数字本身 */
.mg-stat.mute b { color: var(--ink4); }
html[data-theme="dark"] .mg-stat.mute b { color: var(--ink2); }

/* 状态筛选 */
.mg-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
@media (max-width: 480px) {
  /* 手机上按钮多时允许横滑，不挤成两行 */
  .mg-filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .mg-filters::-webkit-scrollbar { display: none; }
}
/* 注意：style.css 里有一条全局 `html[data-theme="dark"] button { color:#0d1117 }`
   （给品牌蓝按钮配深色文字用），它的权重是 (0,1,2)，比单个 `.mg-filters button` (0,1,1) 高。
   所以这里必须写成 `.mg-filters .mg-filters button` (0,2,1) 才压得住，
   否则暗色下筛选按钮会被刷成近黑色、贴在深色卡片上看不见。 */
.mg-filters .mg-filters button {
  border: 1px solid var(--line); background: var(--card); color: var(--ink2);
  border-radius: 8px; padding: 6px 13px; font-size: 13px; font-family: inherit;
  cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s;
}
.mg-filters .mg-filters button:hover { background: var(--sunk); color: var(--ink); }
.mg-filters .mg-filters button.on {
  background: var(--blue); border-color: var(--blue);
  color: #fff; font-weight: 600; box-shadow: 0 1px 6px rgba(37,99,235,.28);
}
.mg-filters .mg-filters button .n { opacity: .72; font-size: 11.5px; margin-left: 4px; }

/* 区块 */
.mg-sec { margin-top: 30px; }
.mg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.mg-head h2 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.mg-head h2 .dot { width: 4px; height: 15px; border-radius: 2px; background: var(--blue); display: inline-block; }
.mg-head .cnt { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* ===== 海报网格 ===== */
.mg-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (min-width: 560px) { .mg-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 760px) { .mg-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

/* 单张海报：3 : 4.1 竖版 */
.mg-item {
  position: relative; display: block; width: 100%;
  aspect-ratio: 3 / 4.1;
  overflow: hidden; border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--sunk);
  color: inherit; text-decoration: none;
  /* 老浏览器不认 aspect-ratio 时用 padding 撑出比例（保证不会塌） */
  min-height: 0;
}
@supports not (aspect-ratio: 3 / 4.1) {
  .mg-item::before { content: ""; display: block; padding-top: 136.7%; }
}
.mg-item:hover { text-decoration: none; border-color: var(--blue); }
.mg-item img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform .3s ease;
}
.mg-item:hover img { transform: scale(1.05); }

/* 没封面时的兜底：渐变底 + 首字 */
.mg-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-weight: 700; color: #fff;
  background: linear-gradient(140deg, var(--blue) 0%, var(--blue-d) 100%);
  opacity: .88;
}
.mg-fallback.g1 { background: linear-gradient(140deg, #4f7cf7, #2f52c9); }
.mg-fallback.g2 { background: linear-gradient(140deg, #5aa9e6, #2b7bbd); }
.mg-fallback.g3 { background: linear-gradient(140deg, #7b8ff5, #4a56c9); }
.mg-fallback.g4 { background: linear-gradient(140deg, #3f8fbf, #1f5f8a); }
html[data-theme="dark"] .mg-fallback { opacity: .72; }

/* 右上角状态角标 */
.mg-tag {
  position: absolute; top: 6px; right: 6px; z-index: 2;
  border-radius: 4px; padding: 2px 7px;
  font-size: 10.5px; font-weight: 700; line-height: 1.5;
  color: #fff; letter-spacing: .2px;
  box-shadow: 0 1px 3px rgba(0,0,0,.22);
}
.mg-tag.t-watching { background: var(--blue); }
.mg-tag.t-wish    { background: #8b949e; }
.mg-tag.t-paused  { background: #c08a2e; }
.mg-tag.t-finished{ background: #2f9e56; }
html[data-theme="dark"] .mg-tag.t-wish { background: #6b7480; }

/* 左上角评分 */
.mg-rate {
  position: absolute; top: 6px; left: 6px; z-index: 2;
  border-radius: 4px; padding: 2px 7px;
  font-size: 10.5px; font-weight: 700; line-height: 1.5;
  background: rgba(0,0,0,.58); color: #ffd76e;
  backdrop-filter: blur(2px);
}

/* 底部渐变压名字 */
.mg-mask {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  padding: 22px 8px 7px;
  background: linear-gradient(to top, rgba(0,0,0,.82) 12%, rgba(0,0,0,.45) 55%, rgba(0,0,0,0) 100%);
}
.mg-mask .nm {
  color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-word;
}
.mg-mask .sub {
  color: rgba(255,255,255,.74); font-size: 11px; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 进度：看到第几集 / 共几话。有总集数才画进度条，否则只显示文字 */
.mg-prog { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.mg-prog .track {
  flex: 1; min-width: 24px; height: 4px; border-radius: 999px;
  background: rgba(255,255,255,.28); overflow: hidden;
}
.mg-prog .track i { display: block; height: 100%; border-radius: 999px; background: #fff; }
.mg-prog .txt {
  color: rgba(255,255,255,.88); font-size: 10.5px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* 覆盖整张卡的链接层（有外链时才有）。放在按钮之下，点卡片空白处照旧跳外链 */
.mg-hit { position: absolute; inset: 0; z-index: 3; }

/* 「＋1 话」：只在登录后、且状态是「在看」时出现，右下角小圆钮 */
.mg-plus {
  position: absolute; right: 6px; bottom: 6px; z-index: 4;
  width: 30px; height: 30px; padding: 0; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.5);
  background: rgba(37,99,235,.94); color: #fff;
  font: 700 12px/1 inherit; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.mg-plus:hover { background: var(--blue-d); }
.mg-plus:disabled { opacity: .55; cursor: default; }
/* 有按钮时给底部文字让出位置，别压在一起 */
.mg-item.has-plus .mg-mask { padding-right: 42px; }

/* 站主：海报左上角的就地编辑 / 删除（压在链接层和「＋1」之上） */
.mg-owner {
  position: absolute; top: 30px; left: 6px; z-index: 5;
  display: flex; gap: 4px;
}
.mg-owner button {
  min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.42);
  background: rgba(0,0,0,.62); color: #fff;
  font: 12px/1 inherit; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.mg-owner button:hover { background: var(--blue); border-color: var(--blue); }
.mg-owner button.del:hover { background: #d1242f; border-color: #d1242f; }
html[data-theme="dark"] .mg-owner button { color: #fff; }

/* 收纳栏（已看完 / 已读完） */
.mg-fold {
  display: flex; align-items: center; justify-content: space-between;
  color: var(--ink4); font-size: 13px; cursor: pointer;
  padding: 10px 14px; border: 1px dashed var(--line2); border-radius: 10px;
  user-select: none; margin-bottom: 14px; background: var(--card);
}
.mg-fold:hover { border-color: var(--blue); color: var(--blue); }
/* 暗色下收纳栏别太灰，否则像被禁用了 */
html[data-theme="dark"] .mg-fold { color: var(--ink3); }
.mg-fold .tri { display: inline-block; transition: transform .18s; margin-right: 8px; font-size: 11px; }
.mg-fold.open .tri { transform: rotate(90deg); }
.mg-fold .n { color: var(--muted); font-size: 12.5px; }
.mg-fold.open .n { color: var(--blue); }
.mg-fold-wrap { margin-top: 4px; }
.mg-fold-wrap .mg-grid { opacity: .82; }
.mg-fold-wrap .mg-item:hover { opacity: 1; }

/* 空状态 */
.mg-empty {
  border: 1px dashed var(--line2); border-radius: 12px;
  padding: 30px 20px; text-align: center; color: var(--muted);
  font-size: 14px; background: var(--card);
}
.mg-empty b { color: var(--ink2); }

/* 小提示行 */
.mg-tip { font-size: 12.5px; color: var(--muted); margin-top: 12px; }

/* ===== 站内播放（M19） ===== */
/* 有官方播放器时，整张卡变成「播放按钮」，海报中央加一个 ▶ */
button.mg-hit {
  border: 0; padding: 0; background: transparent; cursor: pointer;
  font: inherit; color: inherit;
}
button.mg-hit:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.mg-play {
  position: absolute; left: 50%; top: 50%; z-index: 3;
  width: 50px; height: 50px; margin: -25px 0 0 -25px;
  border-radius: 999px; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.52); border: 1.5px solid rgba(255,255,255,.72);
  box-shadow: 0 6px 22px rgba(0,0,0,.36);
  transition: transform .2s ease, background .2s ease;
}
.mg-play::before {
  content: ""; display: block; margin-left: 3px;
  border-style: solid; border-width: 10px 0 10px 17px;
  border-color: transparent transparent transparent #fff;
}
.mg-item:hover .mg-play { transform: scale(1.08); background: rgba(37,99,235,.92); }
@media (prefers-reduced-motion: reduce) {
  .mg-play { transition: none; }
  .mg-item:hover .mg-play { transform: none; }
}

/* 播放器弹层 */
.watch-mask {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(3,7,18,.78);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.watch-panel {
  width: 100%; max-width: 1020px; max-height: 94vh;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.45);
}
.watch-head {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px; border-bottom: 1px solid var(--line);
}
.watch-head h3 {
  flex: 1; min-width: 0; margin: 0; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.watch-x {
  flex: 0 0 auto; width: 30px; height: 30px; padding: 0;
  border: 1px solid var(--line2); border-radius: 8px;
  background: var(--card); color: var(--ink2);
  font: 14px/1 inherit; cursor: pointer;
}
.watch-x:hover { border-color: var(--blue); color: var(--blue); }
html[data-theme="dark"] .watch-x { color: var(--ink); }

.watch-stage {
  position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 64vh;
  background: #000; overflow: hidden;
}
.watch-stage iframe, .watch-stage video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; display: block; background: #000;
}
.watch-error {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  padding: 24px; color: #e6edf3; text-align: center; font-size: 13.5px;
}
.watch-error p { margin: 0; max-width: 460px; line-height: 1.6; }

.watch-foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 14px; padding: 10px 14px;
}
.watch-meta { flex: 1 1 220px; min-width: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.watch-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.watch-btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 34px; padding: 6px 14px; border-radius: 9px;
  border: 1px solid var(--line2); background: var(--card); color: var(--ink2);
  font: 13px/1.2 inherit; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.watch-btn:hover { border-color: var(--blue); color: var(--blue); text-decoration: none; }
.watch-btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.watch-btn.primary:hover { background: var(--blue-d); color: #fff; }
.watch-btn:disabled { opacity: .55; cursor: default; }
.watch-btn.hot { background: #2f9e56; border-color: #2f9e56; color: #fff; font-weight: 600; }
html[data-theme="dark"] .watch-btn { color: var(--ink); }
html[data-theme="dark"] .watch-btn.primary,
html[data-theme="dark"] .watch-btn.hot { color: #fff; }

@media (max-width: 640px) {
  .watch-mask { padding: 0; align-items: flex-start; }
  .watch-panel { max-height: 100dvh; border-radius: 0; border: 0; }
  .watch-stage { max-height: none; }
  .watch-head { padding-top: calc(9px + env(safe-area-inset-top)); }
  .watch-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
}
</style>
</head>

<main class="container" id="main">
  <div class="mg-top">
    <h1>追更</h1>
    <p class="muted">追番、漫画，看过的都留档在这。</p>
    <!-- 只有在本机登录过后台才会出现（读 localStorage 里的后台令牌）。
         没登录的访客看不到这个按钮，也不会发任何请求。 -->
    <button class="mg-add" id="mgAdd" type="button" style="display:none">＋ 快速添加</button>
    <p class="muted" id="ownerHint" style="display:none">编辑模式：点海报上的 ✎ 就地改，✕ 删除；视频页链接会自动变成 ▶ 站内播放。</p>
  </div>

  <!-- 顶部统计（有数据后才显示） -->
  <div class="mg-stats" id="mgStats" style="display:none"></div>

  <!-- 状态筛选（有数据后才显示） -->
  <div class="mg-filters" id="mgFilters" style="display:none"></div>

  <section class="mg-sec">
    <div class="mg-head">
      <h2><span class="dot"></span>追番</h2>
      <span class="cnt" id="cnt-anime"></span>
    </div>
    <!-- 数据库里还没内容时保留这段静态兜底，别删 -->
    <p class="muted" id="hint-anime" aria-live="polite">还没有记录。去管理后台的「追更」标签加第一条。</p>
    <div class="mg-grid" id="list-anime"></div>
    <div id="foldWrap-anime"></div>
  </section>

  <section class="mg-sec">
    <div class="mg-head">
      <h2><span class="dot"></span>漫画</h2>
      <span class="cnt" id="cnt-comic"></span>
    </div>
    <p class="muted" id="hint-comic" aria-live="polite">还没有记录。去管理后台的「追更」标签加第一条。</p>
    <div class="mg-grid" id="list-comic"></div>
    <div id="foldWrap-comic"></div>
  </section>

  <p class="mg-tip">视频条目的链接如果是 B 站 / YouTube / Vimeo 官方视频页（或 mp4 直链），海报上会出现 ▶，可以直接在站内看；漫画等不支持嵌入的站点仍跳站外，进度照常记录。</p>
</main>

<script src="../watch.js"></script>
<script src="../owner.js"></script>
<script src="../admin/content.js"></script>
<script>
/* ===========================================================================
   追更：追番 / 漫画的留档（海报墙版式）
   ---------------------------------------------------------------------------
   先静态兜底（上面的空状态）→ 再读接口渲染 → 失败保持静态，永不白屏。
   要点：
     - 卡片是 3:4.1 竖版海报，走 CSS Grid（2 / 3 / 5 列），名字压在底部黑色渐变上
     - 没封面图用「渐变底 + 名称首字」兜底，不会开天窗
     - 顶部统计 + 状态筛选是纯前端过滤（数据一次读完，切换即时生效）
     - 全部内容走 textContent / setAttribute，绝不拼 innerHTML
     - 已看完 / 已读完 收进折叠栏，默认收起
   =========================================================================== */
(function () {
  "use strict";

  var LABEL = {
    anime: { wish: "想看", watching: "在看", finished: "看完", paused: "搁置", done: "已看完" },
    comic: { wish: "想读", watching: "在读", finished: "读完", paused: "搁置", done: "已读完" }
  };
  var EMPTY_HINT = "还没有记录。";
  /* 筛选顺序：在追的排前面，已完成的最后 */
  var STATUS_ORDER = ["watching", "wish", "paused", "finished"];

  var allItems = [];        /* 接口返回的原始列表 */
  var canEdit = false;      /* 本机存过后台令牌 → 才渲染「＋1 话」等写入按钮 */
  var filter = "all";       /* 当前状态筛选 */

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function safeUrl(u) {
    u = String(u == null ? "" : u);
    return /^https?:\/\//i.test(u) ? u : "";
  }
  function firstChar(s) {
    s = String(s == null ? "" : s).trim();
    return s ? s.slice(0, 1) : "?";
  }

  /* 一张海报 */
  /* 进度：progress = 看到第几集，episodes = 总集数。两个都可空。
     - 都有 → 画进度条 + 「12 / 28」
     - 只有总集数 → 只显示「共 28 话」
     - 只有进度   → 只显示「看到 12 话」（连载中不知道总数很正常） */
  function progressOf(d) {
    var hasCur = d.progress !== null && d.progress !== undefined && d.progress !== "";
    var hasTot = d.episodes !== null && d.episodes !== undefined && d.episodes !== "";
    if (!hasCur && !hasTot) return null;
    var cur = hasCur ? Number(d.progress) : null;
    var tot = hasTot ? Number(d.episodes) : null;
    if (cur != null && tot != null && tot > 0) {
      return { pct: Math.max(0, Math.min(100, Math.round(cur / tot * 100))), text: cur + " / " + tot };
    }
    if (tot != null) return { pct: null, text: "共 " + tot + " 话" };
    return { pct: null, text: "看到 " + cur + " 话" };
  }

  function makeCard(it, lab) {
    var d = it.data || {};
    var status = lab[d.status] ? d.status : "wish";
    var link = safeUrl(d.url);
    var cover = safeUrl(d.cover);
    /* 只有能认出官方播放器（B 站 / YouTube / Vimeo / 直链）才变「播放」，
       漫画站和其他不支持嵌入的链接继续走站外打开。 */
    var play = link && window.Watch ? Watch.parse(link) : null;

    /* 卡片永远是 <div> 容器：这样「＋1」按钮才能合法地放进来
       （<button> 不允许嵌在 <a> 里）。有外链时另外铺一层覆盖全卡的 <a>。 */
    var card = el("div", "mg-item");

    if (cover) {
      var img = el("img");
      img.src = cover;
      img.alt = "";
      img.loading = "lazy";
      /* 图挂了就换成渐变兜底，不让卡片空着 */
      img.addEventListener("error", function () {
        if (!img.parentNode) return;
        img.parentNode.removeChild(img);
        card.insertBefore(makeFallback(d.name, it.id), card.firstChild);
      });
      card.appendChild(img);
    } else {
      card.appendChild(makeFallback(d.name, it.id));
    }

    /* 左上角评分 */
    if (d.score != null && d.score !== "") {
      card.appendChild(el("span", "mg-rate", "★ " + Number(d.score).toFixed(1)));
    }
    /* 右上角状态 */
    card.appendChild(el("span", "mg-tag t-" + status, lab[d.status] || ""));

    /* 底部渐变压名字 */
    var mask = el("div", "mg-mask");
    var pg = progressOf(d);
    if (pg) {
      var bar = el("div", "mg-prog");
      if (pg.pct != null) {
        var track = el("span", "track");
        var fill = el("i");
        fill.style.width = pg.pct + "%";
        track.appendChild(fill);
        bar.appendChild(track);
      }
      bar.appendChild(el("span", "txt", pg.text));
      mask.appendChild(bar);
    }
    mask.appendChild(el("div", "nm", d.name || "(未命名)"));
    if (d.note) mask.appendChild(el("div", "sub", d.note));
    card.appendChild(mask);

    /* 能站内播放的条目，海报中央加一个 ▶ */
    if (play) {
      card.classList.add("is-play");
      var badge = el("span", "mg-play");
      badge.setAttribute("aria-hidden", "true");
      card.appendChild(badge);
    }

    /* 覆盖全卡的点击层。放在按钮之前，按钮才点得到。
       能播放的用 <button> 开弹层；不能嵌入的仍是跳外链。 */
    if (play) {
      var playHit = el("button", "mg-hit");
      playHit.type = "button";
      playHit.title = "在站内播放";
      playHit.setAttribute("aria-label",
        "在站内播放「" + (d.name || "这个视频") + "」（" + play.label + "）");
      playHit.addEventListener("click", function () { openWatch(it); });
      card.appendChild(playHit);
    } else if (link) {
      var hit = el("a", "mg-hit");
      hit.href = link;
      hit.target = "_blank";
      hit.rel = "noopener noreferrer";
      hit.setAttribute("aria-label", (d.name || "条目") + "（新窗口打开）");
      card.appendChild(hit);
    }

    /* 登录后：状态是「在看」就给一个「＋1 话」——追更最高频的动作 */
    if (canEdit && d.status === "watching") {
      var plus = el("button", "mg-plus", "＋1");
      plus.type = "button";
      plus.title = "看到下一话";
      plus.setAttribute("aria-label", "把「" + (d.name || "这条") + "」的进度 +1");
      plus.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        bumpProgress(it, plus);
      });
      card.classList.add("has-plus");
      card.appendChild(plus);
    }

    /* 站主：就地编辑 / 删除（不必再跳后台列表） */
    if (canEdit && window.ContentAdmin) card.appendChild(ownerActions(it, d));

    return card;
  }

  function ownerActions(it, d) {
    var wrap = el("div", "mg-owner");

    var ed = el("button", null, "✎");
    ed.type = "button";
    ed.title = "编辑这条";
    ed.setAttribute("aria-label", "编辑「" + (d.name || "这条") + "」");
    ed.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      ContentAdmin.openItem("media", it, { afterSave: reloadMedia });
    });
    wrap.appendChild(ed);

    var del = el("button", "del", "✕");
    del.type = "button";
    del.title = "删除这条";
    del.setAttribute("aria-label", "删除「" + (d.name || "这条") + "」");
    del.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      ContentAdmin.removeItem("media", it, { afterDelete: reloadMedia });
    });
    wrap.appendChild(del);
    return wrap;
  }

  /* 单条 PATCH：续播点、进度都走这里。
     keepalive 用在页面关闭 / 切后台时，浏览器会尽量把请求发完。 */
  function patchMedia(id, patch, opts) {
    return fetch("/api/content", {
      method: "PATCH",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + getToken() },
      body: JSON.stringify({ id: id, data: patch }),
      keepalive: !!(opts && opts.keepalive),
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ("请求失败（" + r.status + "）"));
        return j;
      });
    });
  }

  /* 「＋1 话」：直接 PATCH 这一条的 progress，成功后就地重画整面墙。
     btn 可空（播放器里用），done / fail 用来更新播放器底部状态。 */
  function bumpProgress(it, btn, done, fail) {
    var d = it.data || {};
    var cur = (d.progress === null || d.progress === undefined || d.progress === "")
      ? 0 : Number(d.progress);
    var next = cur + 1;
    if (btn) btn.disabled = true;
    /* 进入下一集时把上一集的续播点归零，否则新一集会直接跳到上一集结尾 */
    return patchMedia(it.id, { progress: next, position: 0 }).then(function () {
      d.progress = next;          /* 同一条对象，改完直接重画 */
      d.position = 0;
      if (typeof done === "function") done(next);
      apply(allItems);
      return next;
    }).catch(function (e) {
      if (btn) btn.disabled = false;
      if (typeof fail === "function") fail(e.message);
      else if (window.Owner) Owner.toast("没记上：" + e.message, "err");
      else alert("没记上：" + e.message);
      throw e;
    });
  }

  /* 站内播放：watch.js 负责解析、iframe、续播点；这里只提供写入通道 */
  function openWatch(it) {
    var d = it.data || {};
    if (!window.Watch) return;
    var opened = Watch.open(it, {
      canEdit: canEdit,
      save: function (patch, o) { return patchMedia(it.id, patch, o); },
      plus: function (done, fail) { bumpProgress(it, null, done, fail); },
      toast: function (msg, kind) { if (window.Owner) Owner.toast(msg, kind); },
    });
    if (opened) return;
    var link = safeUrl(d.url);
    if (link) window.open(link, "_blank", "noopener");
  }

  /* 渐变兜底块：按 id 取一个固定的配色，同一部作品每次进来颜色一样 */
  function makeFallback(name, id) {
    var gi = (Number(id) || 0) % 4;
    var f = el("div", "mg-fallback" + (gi ? " g" + gi : ""));
    f.appendChild(document.createTextNode(firstChar(name)));
    return f;
  }

  /* 渲染一个栏目（anime / comic） */
  function renderSection(key, items) {
    var lab = LABEL[key];
    var list = $("list-" + key), hint = $("hint-" + key);
    var foldWrap = $("foldWrap-" + key), cnt = $("cnt-" + key);

    /* 新的排前面 */
    items = items.slice().sort(function (a, b) {
      return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
    });

    var active = [], done = [];
    items.forEach(function (it) {
      if (it.data && it.data.status === "finished") done.push(it);
      else active.push(it);
    });

    cnt.textContent = items.length ? "共 " + items.length + " 部" : "";

    list.innerHTML = "";
    foldWrap.innerHTML = "";
    if (items.length) hint.style.display = "none";
    else {
      hint.style.display = "";
      hint.textContent = canEdit
        ? "还没有记录。点上面的「＋ 快速添加」加第一条。"
        : EMPTY_HINT;
    }

    active.forEach(function (it) { list.appendChild(makeCard(it, lab)); });
    if (!active.length && items.length) {
      var p = el("p", "muted");
      p.style.gridColumn = "1 / -1";
      p.textContent = "当前没有在追的，都收在下面的收纳栏里。";
      list.appendChild(p);
    }

    if (!done.length) return;

    /* 收纳栏：折叠头 + 展开后的同款海报墙 */
    var wrap = el("div", "mg-fold-wrap");
    var fold = el("div", "mg-fold");
    var left = el("span");
    left.appendChild(el("span", "tri", "▸"));
    left.appendChild(el("span", null, lab.done));
    fold.appendChild(left);
    fold.appendChild(el("span", "n", done.length + " 部 · 点击展开"));
    var grid = el("div", "mg-grid");
    grid.style.display = "none";
    done.forEach(function (it) { grid.appendChild(makeCard(it, lab)); });

    fold.addEventListener("click", function () {
      var open = fold.classList.toggle("open");
      grid.style.display = open ? "" : "none";
      fold.querySelector(".n").textContent = done.length + " 部 · " + (open ? "点击收起" : "点击展开");
    });

    wrap.appendChild(fold);
    wrap.appendChild(grid);
    foldWrap.appendChild(wrap);
  }

  /* 顶部统计：总部数 / 在追 / 想看 / 已看完 */
  function renderStats(items) {
    var box = $("mgStats");
    if (!items.length) { box.style.display = "none"; return; }
    box.style.display = "";
    box.innerHTML = "";

    var n = { watching: 0, wish: 0, paused: 0, finished: 0 };
    items.forEach(function (it) {
      var s = it.data && it.data.status;
      if (n[s] != null) n[s]++;
    });

    function cell(val, label, mute) {
      var c = el("div", "mg-stat" + (mute ? " mute" : ""));
      c.appendChild(el("b", null, String(val)));
      c.appendChild(el("span", null, label));
      return c;
    }
    box.appendChild(cell(items.length, "全部留档"));
    box.appendChild(cell(n.watching, "在追"));
    box.appendChild(cell(n.wish, "想看 / 想读", true));
    box.appendChild(cell(n.paused, "搁置", true));
    box.appendChild(cell(n.finished, "已看完 · 已读完", true));
  }

  /* 状态筛选条 */
  function renderFilters(items) {
    var box = $("mgFilters");
    if (!items.length) { box.style.display = "none"; return; }

    var counts = { all: items.length, wish: 0, watching: 0, paused: 0, finished: 0 };
    items.forEach(function (it) {
      var s = it.data && it.data.status;
      if (counts[s] != null) counts[s]++;
    });

    var defs = [["all", "全部"]].concat(STATUS_ORDER.map(function (s) {
      return [s, { wish: "想看 / 想读", watching: "在追", paused: "搁置", finished: "已看完" }[s]];
    }));

    box.style.display = "";
    box.innerHTML = "";
    defs.forEach(function (pair) {
      var key = pair[0], labelText = pair[1];
      if (key !== "all" && !counts[key]) return;   /* 没这个状态的就不显示这个按钮 */
      var b = el("button", filter === key ? "on" : "");
      b.type = "button";
      b.appendChild(document.createTextNode(labelText));
      var num = el("span", "n", String(counts[key]));
      b.appendChild(num);
      b.addEventListener("click", function () {
        filter = key;
        apply(allItems);
      });
      box.appendChild(b);
    });
  }

  /* 当前筛选下该栏目要显示的条目 */
  function filtered(items, key) {
    return items.filter(function (it) {
      if (!it.data || it.data.category !== key) return false;
      if (filter !== "all" && it.data.status !== filter) return false;
      return true;
    });
  }

  function apply(items) {
    allItems = items;
    renderStats(items);
    renderFilters(items);
    ["anime", "comic"].forEach(function (key) {
      renderSection(key, filtered(items, key));
    });
  }

  /* ==================== 快速添加（前台就地新增，免进后台） ====================
     原则：
       - 不在公开页放登录框（本站单人自用，不需要对外登录入口）
       - 只在「本机已经登录过后台」时才显示按钮（读 localStorage 里的后台令牌）
       - 没令牌就完全静默，连按钮都不渲染，更不发请求
       - 全部用 DOM API + textContent，不拼 innerHTML
     令牌键与 admin 保持一致（键名 eraser.admin.token，同源才能读到）。 */
  var TOKEN_KEY = "eraser.admin.token";

  function getToken() {
    if (window.Owner) return Owner.token();   /* 与全站共用同一把钥匙和过期处理 */
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }

  if (window.Owner && window.ContentAdmin && getToken()) {
    ContentAdmin.init({ api: Owner.api, say: Owner.say });
  }

  function apiPost(path, body) {
    var t = getToken();
    return fetch("/api/" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + t },
      body: JSON.stringify(body),
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error((j && j.error) || ("请求失败（" + r.status + "）"));
        return j;
      });
    });
  }

  function closeModal(overlay) {
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    document.body.style.overflow = "";
  }

  /* 弹出一个快速添加表单 */
  function openQuickAdd() {
    var overlay = el("div", "mg-modal");
    var panel = el("div", "panel");

    panel.appendChild(el("h3", null, "＋ 快速添加"));
    panel.appendChild(el("p", "mhint", "填个名字就行，其余都可以留空。想自动带出封面/评分，可先点「按名字补全」。"));

    var f = {};

    /* 名字 + 补全按钮 */
    var nameLab = el("label", null, "名字（必填）");
    panel.appendChild(nameLab);
    var fillRow = el("div", "mfill");
    var nameWrap = el("div");
    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = "比如：葬送的芙莉莲";
    nameWrap.appendChild(nameInput);
    fillRow.appendChild(nameWrap);
    var fillBtn = el("button", null, "✨ 按名字补全");
    fillBtn.type = "button";
    fillRow.appendChild(fillBtn);
    panel.appendChild(fillRow);
    f.name = nameInput;

    var msg = el("div", "mmsg");
    panel.appendChild(msg);

    /* 栏目 + 状态 */
    var two1 = el("div", "two");
    var cWrap = el("div");
    cWrap.appendChild(el("label", null, "栏目"));
    var catSel = document.createElement("select");
    [["anime", "追番"], ["comic", "漫画"]].forEach(function (o) {
      var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; catSel.appendChild(op);
    });
    cWrap.appendChild(catSel);
    two1.appendChild(cWrap);

    var sWrap = el("div");
    sWrap.appendChild(el("label", null, "状态"));
    var stSel = document.createElement("select");
    [["watching", "在看"], ["wish", "想看"], ["paused", "搁置"], ["finished", "看完"]].forEach(function (o) {
      var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; stSel.appendChild(op);
    });
    sWrap.appendChild(stSel);
    two1.appendChild(sWrap);
    panel.appendChild(two1);

    /* 评分 + 日期 */
    var two2 = el("div", "two");
    var scWrap = el("div");
    scWrap.appendChild(el("label", null, "评分（0-10，可空）"));
    var scInput = document.createElement("input");
    scInput.type = "text"; scInput.placeholder = "比如：9.1";
    scWrap.appendChild(scInput);
    two2.appendChild(scWrap);

    var dWrap = el("div");
    dWrap.appendChild(el("label", null, "日期（可空）"));
    var dInput = document.createElement("input");
    dInput.type = "text"; dInput.placeholder = "2026-10-16";
    dWrap.appendChild(dInput);
    two2.appendChild(dWrap);
    panel.appendChild(two2);

    /* 总集数 + 看到第几集 */
    var two3 = el("div", "two");
    var epWrap = el("div");
    epWrap.appendChild(el("label", null, "总集数（可空）"));
    var epInput = document.createElement("input");
    epInput.type = "text"; epInput.placeholder = "比如：28";
    epWrap.appendChild(epInput);
    two3.appendChild(epWrap);

    var pgWrap = el("div");
    pgWrap.appendChild(el("label", null, "看到第几集（可空）"));
    var pgInput = document.createElement("input");
    pgInput.type = "text"; pgInput.placeholder = "比如：12";
    pgWrap.appendChild(pgInput);
    two3.appendChild(pgWrap);
    panel.appendChild(two3);

    /* 备注 */
    panel.appendChild(el("label", null, "备注（可空）"));
    var noteInput = document.createElement("input");
    noteInput.type = "text"; noteInput.placeholder = "比如：周五更新 · B站有删减";
    panel.appendChild(noteInput);

    /* 链接 + 封面 */
    panel.appendChild(el("label", null, "链接（可空）"));
    var urlInput = document.createElement("input");
    urlInput.type = "text"; urlInput.placeholder = "https://…";
    panel.appendChild(urlInput);

    panel.appendChild(el("label", null, "封面图链接（可空）"));
    var covInput = document.createElement("input");
    covInput.type = "text"; covInput.placeholder = "https://…图片地址";
    panel.appendChild(covInput);

    /* 操作 */
    var acts = el("div", "acts");
    var bCancel = el("button", null, "取消");
    bCancel.type = "button";
    bCancel.addEventListener("click", function () { closeModal(overlay); });
    var bSave = el("button", "primary", "保存");
    bSave.type = "button";
    acts.appendChild(bCancel);
    acts.appendChild(bSave);
    panel.appendChild(acts);

    function setMsg(text, kind) {
      msg.textContent = text || "";
      msg.className = "mmsg" + (kind ? " " + kind : "");
    }

    /* 按名字补全：查 AniList，取第一条回填 */
    fillBtn.addEventListener("click", function () {
      var q = nameInput.value.trim();
      if (!q) { nameInput.focus(); return; }
      fillBtn.disabled = true;
      setMsg("查询中…");
      var t = getToken();
      fetch("/api/content?action=lookup&q=" + encodeURIComponent(q) + "&kind=" + encodeURIComponent(catSel.value), {
        headers: { Authorization: "Bearer " + t, Accept: "application/json" },
      })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (j) {
          var hit = j && j.results && j.results[0];
          if (!hit) { setMsg(j && j.hint ? j.hint : "没找到，直接手填也行。", "err"); return; }
          if (hit.name) nameInput.value = hit.name;
          if (hit.score != null) scInput.value = String(hit.score);
          if (hit.episodes != null) epInput.value = String(hit.episodes);
          if (hit.note) noteInput.value = hit.note;
          if (hit.url) urlInput.value = hit.url;
          if (hit.cover) covInput.value = hit.cover;
          setMsg("已填好：" + hit.name, "ok");
        })
        .catch(function () { setMsg("补全失败，直接手填也行。", "err"); })
        .then(function () { fillBtn.disabled = false; });
    });

    bSave.addEventListener("click", function () {
      var name = nameInput.value.trim();
      if (!name) { setMsg("名字不能空", "err"); nameInput.focus(); return; }
      bSave.disabled = true;
      setMsg("保存中…");
      apiPost("content", {
        type: "media",
        data: {
          category: catSel.value,
          name: name,
          status: stSel.value,
          score: scInput.value.trim(),
          episodes: epInput.value.trim(),
          progress: pgInput.value.trim(),
          note: noteInput.value.trim(),
          date: dInput.value.trim(),
          url: urlInput.value.trim(),
          cover: covInput.value.trim(),
        },
      })
        .then(function () {
          setMsg("已添加", "ok");
          closeModal(overlay);
          reloadMedia();
        })
        .catch(function (e) {
          bSave.disabled = false;
          setMsg(e.message || "保存失败", "err");
        });
    });

    overlay.appendChild(panel);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(overlay); });
    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";
    nameInput.focus();
  }

  /* 重新拉一次数据并重绘（新增后用）。失败时保持现有画面：
     宁可显示旧数据，也不能因为一次刷新失败把已加载的内容清空。 */
  function reloadMedia() {
    if (!window.fetch) return;
    fetch("/api/content?type=media", { headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);   /* 5xx 不是空库 */
        return r.json();
      })
      .then(function (j) { apply((j && j.items) || []); })
      .catch(function () {});
  }

  /* 有令牌才显示「快速添加」按钮 */
  function setupQuickAdd() {
    if (!getToken()) return;
    var btn = $("mgAdd");
    if (!btn) return;
    btn.style.display = "";
    btn.addEventListener("click", openQuickAdd);
    var oh = $("ownerHint");
    if (oh) oh.style.display = "";
  }

  /* ==================== 首次加载：三态（加载中 / 失败可重试 / 真空态） ====================
     原版接口挂了停在「还没有记录」，把故障伪装成空库，排查时误导人。 */
  function setHint(key, text, retry) {
    var h = $("hint-" + key);
    if (!h) return;
    h.style.display = "";
    h.textContent = text;
    if (!retry) return;
    var b = el("button", "ghost");
    b.type = "button";
    b.textContent = "重试";
    b.style.marginLeft = "8px";
    b.addEventListener("click", loadMedia);
    h.appendChild(b);
  }

  function loadMedia() {
    ["anime", "comic"].forEach(function (k) { setHint(k, "正在加载…"); });
    fetch("/api/content?type=media", { headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        canEdit = !!getToken();   /* 有令牌才画「＋1 话」，必须先于 apply */
        apply((j && j.items) || []);
        setupQuickAdd();   /* 数据到手后再决定是否显示按钮，避免闪一下 */
      })
      .catch(function () {
        ["anime", "comic"].forEach(function (k) {
          setHint(k, "记录暂时没拿到（网络或接口出了问题）。", true);
        });
      });
  }

  if (!window.fetch) return;
  loadMedia();
})();
</script>
<script src="../shell.js"></script>
</body>
</html>
