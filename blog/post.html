<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* 尽早定主题，避免闪白；没存过就跟随系统偏好（切换按钮与命令面板见 shell.js） */
(function(){try{var t=localStorage.getItem("eraser.theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>文章 - Eraser 的小站</title>
<link rel="stylesheet" href="../style.css">
<style>
  .post-head{ margin-bottom:26px; }
  .post-head h1{ font-size:28px; line-height:1.35; margin:0 0 10px; }
  .post-meta{ color:var(--muted); font-size:13.5px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .tagline{ display:flex; gap:6px; flex-wrap:wrap; }
  .tagline span{ background:var(--sunk); color:var(--ink4); font-size:12px; border-radius:20px; padding:1px 9px; }
  .article{ font-size:16px; line-height:1.85; color:var(--ink); overflow-wrap:break-word; }
  .article h1,.article h2,.article h3,.article h4{ margin:28px 0 12px; line-height:1.4; }
  .article h1{ font-size:23px; } .article h2{ font-size:20px; } .article h3{ font-size:17px; }
  .article p{ margin:14px 0; }
  .article ul,.article ol{ margin:14px 0; padding-left:24px; }
  .article li{ margin:6px 0; }
  .article pre{ background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; font-size:13.5px; }
  .article code{ background:var(--sunk); border-radius:4px; padding:1px 5px; font-size:14px;
                 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .article pre code{ background:none; padding:0; font-size:13.5px; }
  .article blockquote{ border-left:3px solid var(--line); margin:16px 0; padding:2px 0 2px 14px; color:var(--ink4); }
  .article hr{ border:none; border-top:1px solid var(--line); margin:26px 0; }
  .article a{ color:var(--blue); }
  .loading{ color:var(--muted); padding:40px 0; text-align:center; }
  .back{ display:inline-block; margin-top:34px; font-size:14px; }
  .post-nav{ display:flex; justify-content:space-between; gap:12px; margin-top:34px; flex-wrap:wrap; }
  .post-nav a{ font-size:14px; color:var(--blue); }
</style>
</head>
<body>
<div class="navbar">
  <span class="logo">🧩 Eraser 的小站</span>
  <nav>
    <a href="../index.html">搜索</a>
    <a href="../tools/index.html">工具箱</a>
    <a href="index.html" class="active">博客</a>
    <a href="../collect/index.html">追更</a>
    <a href="../nav/index.html">导航</a>
    <a href="../about/index.html">关于</a>
  </nav>
</div>
<div class="container" id="container">
  <div class="loading">正在加载…</div>
</div>

<script src="../md.js"></script>
<script>
(function(){
  var box = document.getElementById("container");

  function esc(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  /* 用 DOM 拼提示，不拼 HTML 字符串 */
  function say(text, withBack){
    box.innerHTML = "";
    var d = document.createElement("div");
    d.className = "loading";
    d.appendChild(document.createTextNode(text));
    if (withBack){
      d.appendChild(document.createElement("br"));
      var a = document.createElement("a");
      a.href = "index.html";
      a.textContent = "回到博客列表";
      d.appendChild(a);
    }
    box.appendChild(d);
  }
  function param(name){
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }

  var slug = param("slug");
  if (!slug){ say("没有指定文章。", true); return; }

  if (!window.fetch){ say("这个浏览器不支持读取文章。", true); return; }

  fetch("/api/content?type=post", { headers: { Accept: "application/json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var items = (j && j.items) || [];
      var found = null;
      for (var i = 0; i < items.length; i++){
        if (items[i].data && items[i].data.slug === slug){ found = items[i]; break; }
      }
      if (!found || found.data.published === false){
        say("找不到这篇文章。", true);
        return;
      }

      /* 与博客列表同序：先过滤草稿，再按更新时间倒序，定位当前篇的位置 */
      var posts = items.filter(function(p){
        return p.data && p.data.published !== false;
      });
      posts.sort(function(a, b){
        return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
      });
      var idx = -1;
      for (var k = 0; k < posts.length; k++){
        if (posts[k].data && posts[k].data.slug === slug){ idx = k; break; }
      }

      var d = found.data;
      document.title = d.title + " - 博客";

      box.innerHTML = "";
      var head = document.createElement("div");
      head.className = "post-head";

      var h1 = document.createElement("h1");
      h1.textContent = d.title;
      head.appendChild(h1);

      var meta = document.createElement("div");
      meta.className = "post-meta";
      var when = document.createElement("span");
      when.textContent = String(found.updated_at || "").slice(0, 10);
      meta.appendChild(when);

      if (d.tags && d.tags.length){
        var tl = document.createElement("span");
        tl.className = "tagline";
        d.tags.forEach(function(t){
          var s = document.createElement("span");
          s.textContent = t;
          tl.appendChild(s);
        });
        meta.appendChild(tl);
      }
      head.appendChild(meta);
      box.appendChild(head);

      var art = document.createElement("div");
      art.className = "article";
      /* MD.render 会先把内容整体转义再生成标签，所以这里赋值是安全的 */
      art.innerHTML = window.MD ? MD.render(d.content) : esc(d.content);
      box.appendChild(art);

      /* 上一篇（更旧，下标 +1）/ 下一篇（更新，下标 -1）；
         边界篇对应方向的链接不渲染。用 DOM 拼，标题走 textContent。 */
      var nav = document.createElement("div");
      nav.className = "post-nav";
      function addNavLink(p, label){
        var a = document.createElement("a");
        a.href = "post.html?slug=" + encodeURIComponent(p.data.slug);
        a.textContent = label + "：" + p.data.title;
        nav.appendChild(a);
      }
      if (idx >= 0){
        if (idx + 1 < posts.length) addNavLink(posts[idx + 1], "上一篇");
        if (idx - 1 >= 0) addNavLink(posts[idx - 1], "下一篇");
      }
      if (nav.firstChild) box.appendChild(nav);

      var back = document.createElement("a");
      back.className = "back";
      back.href = "index.html";
      back.textContent = "← 回到博客列表";
      box.appendChild(back);
    })
    .catch(function(){
      say("加载失败，请稍后再试。", true);
    });
})();
</script>
<script src="../shell.js"></script>
</body>
</html>
