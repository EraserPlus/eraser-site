<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 - Eraser 的小站</title>
<link rel="stylesheet" href="../style.css">
<link rel="alternate" type="application/rss+xml" title="RSS 订阅" href="/api/rss">
</head>
<body>
<div class="navbar">
  <span class="logo">🧩 Eraser 的小站</span>
  <nav>
    <a href="../index.html">首页</a>
    <a href="../search/index.html">搜索</a>
    <a href="../tools/index.html">工具箱</a>
    <a href="index.html" class="active">博客</a>
    <a href="../nav/index.html">导航</a>
    <a href="../about/index.html">关于</a>
  </nav>
</div>
<div class="container">
  <h1>✏️ 博客</h1>
  <p class="muted">文章在管理后台里用 Markdown 写，这里自动列出。</p>

  <!-- 空状态：还没有文章、或接口不可用时显示，页面不会白屏 -->
  <div id="list"></div>
  <p class="muted" id="hint">还没有文章。去管理后台的「博客」标签写一篇。</p>
</div>

<script>
(function(){
  var list = document.getElementById("list");
  var hint = document.getElementById("hint");
  if (!window.fetch) return;

  function esc(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  fetch("/api/content?type=post", { headers: { Accept: "application/json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var items = ((j && j.items) || []).filter(function(p){
        return p.data && p.data.published !== false;
      });
      if (!items.length){ hint.style.display = ""; return; }   // 数据库里还没内容，保留静态兜底

      /* 新的排前面 */
      items.sort(function(a, b){
        return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
      });

      list.innerHTML = "";
      items.forEach(function(p){
        var d = p.data;
        var row = document.createElement("div");
        row.className = "list-item";

        var left = document.createElement("div");
        var name = document.createElement("div");
        name.className = "name";
        name.textContent = d.title;
        left.appendChild(name);

        var desc = document.createElement("div");
        desc.className = "desc";
        var bits = [String(p.updated_at || "").slice(0, 10)];
        var summary = d.summary || (window.MD ? MD.plain(d.content, 60) : "");
        if (summary) bits.push(summary);
        desc.textContent = bits.filter(Boolean).join(" · ");
        left.appendChild(desc);

        if (d.tags && d.tags.length){
          var tags = document.createElement("div");
          tags.className = "desc";
          tags.style.marginTop = "3px";
          tags.textContent = d.tags.map(function(t){ return "#" + t; }).join(" ");
          left.appendChild(tags);
        }
        row.appendChild(left);

        var a = document.createElement("a");
        a.href = "post.html?slug=" + encodeURIComponent(d.slug);
        var b = document.createElement("button");
        b.className = "ghost";
        b.textContent = "阅读";
        a.appendChild(b);
        row.appendChild(a);

        list.appendChild(row);
      });
      hint.style.display = "none";
    })
    .catch(function(){ hint.style.display = ""; });   // 接口挂了就显示空状态提示
})();
</script>
</body>
</html>
