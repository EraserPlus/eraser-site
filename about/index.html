<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* 尽早定主题，避免闪白；没存过就跟随系统偏好（切换按钮与命令面板见 shell.js） */
(function(){try{var t=localStorage.getItem("eraser.theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<title>关于 · Eraser 的小站</title>
<link rel="stylesheet" href="../style.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="关于 Eraser 的小站：这个站是什么、用什么搭的、为什么做。">
<!-- 分享卡片（og / twitter）：贴到聊天工具里能出预览 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Eraser 的小站">
<meta property="og:title" content="关于 · Eraser 的小站">
<meta property="og:description" content="关于 Eraser 的小站：这个站是什么、用什么搭的、为什么做。">
<meta property="og:url" content="https://eraser.de5.net/about/">
<meta property="og:image" content="https://eraser.de5.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  .article{ font-size:15.5px; line-height:1.85; overflow-wrap:break-word; }
  .article h1,.article h2,.article h3{ margin:26px 0 12px; line-height:1.4; }
  .article h1{ font-size:22px; } .article h2{ font-size:19px; } .article h3{ font-size:16.5px; }
  .article p{ margin:13px 0; }
  .article ul,.article ol{ margin:13px 0; padding-left:24px; }
  .article li{ margin:5px 0; }
  .article pre{ background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; font-size:13.5px; }
  .article code{ background:var(--sunk); border-radius:4px; padding:1px 5px; font-size:14px;
                 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .article pre code{ background:none; padding:0; }
  .article blockquote{ border-left:3px solid var(--line); margin:16px 0; padding:2px 0 2px 14px; color:var(--ink4); }
  .article a{ color:var(--blue); }
  .runbadge{ margin-top:26px; text-align:center; font-size:12.5px; color:var(--muted); }
  .runbadge b{ color:var(--ink); }
  .runbadge .dot{ color:var(--green); }
  html[data-theme="dark"] .runbadge b{ color:var(--ink); }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div class="navbar">
  <span class="logo">🧩 Eraser 的小站</span>
  <nav>

  </nav>
</div>
<main class="container" id="main">
  <!-- 静态兜底：接口不可用时显示这些 -->
  <div class="article" id="article">
    <h1>关于我</h1>
    <p>你好，我是 Eraser。这个站是我的个人小角落，放点工具、文件和随笔。</p>
    <h2>联系方式</h2>
    <p>GitHub：<a href="https://github.com/EraserPlus" target="_blank" rel="noopener noreferrer">EraserPlus</a></p>
  </div>
  <!-- 运行徽章放在 article 外：后台用 Markdown 替换正文时不动它 -->
  <p class="runbadge"><span class="dot">●</span> 本站已稳定运行 <b id="runDays">—</b> 天 · 自 2026 年 10 月起</p>
  <p class="runbadge" style="margin-top:8px"><a href="../dev/index.html" style="color:var(--muted)">🎛️ 开发交接（给接手的 AI）→</a></p>
</main>

<script src="../md.js"></script>
<script>
/* 站点运行徽章：按首次上线日期算天数，改 SITE_LAUNCH 即可 */
var SITE_LAUNCH = "2026-10-13";
(function(){
  var b = document.getElementById("runDays");
  if (!b) return;
  var t = new Date(SITE_LAUNCH + "T00:00:00").getTime();
  if (isNaN(t)) return;
  var d = Math.floor((Date.now() - t) / 86400000);
  b.textContent = d < 0 ? 0 : d;
})();
</script>
<script>
(function(){
  var art = document.getElementById("article");
  if (!window.fetch) return;

  fetch("/api/content?type=page", { headers: { Accept: "application/json" } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var items = (j && j.items) || [];
      var page = null;
      for (var i = 0; i < items.length; i++){
        if (items[i].data && items[i].data.key === "about"){ page = items[i]; break; }
      }
      if (!page) return;   // 还没在后台写过，保留静态兜底

      document.title = page.data.title + " · Eraser 的小站";
      /* MD.render 会先整体转义再生成标签 */
      art.innerHTML = window.MD ? MD.render(page.data.content) : "";
    })
    .catch(function(){ /* 接口挂了就保留静态兜底 */ });
})();
</script>
<script src="../shell.js"></script>
</body>
</html>
